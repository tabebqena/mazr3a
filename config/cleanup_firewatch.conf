# ============================================================
# Firewatch evidence-store cleanup - tunable settings.
# Used by: scripts/cleanup_firewatch_store.py, run from the host
# crontab INSIDE the firewatch container (see scripts/crontab.sample):
#   */30 * * * * /usr/bin/docker exec firewatch python /scripts/cleanup_firewatch_store.py
#
# The script caps the stored firewatch JPEGs (deleting the OLDEST first) and
# expires DB rows after a set age. The SQLite DB (frames/detections) is the
# source of truth - only files referenced by deleted rows are removed, so
# Frigate media sharing the host ./media mount is never touched.
#
# Store location is intentionally NOT set here: it is read from the firewatch
# container (STORE_DIR + STORE_DB in config/firewatch.conf / env), so cleanup
# can never drift from where firewatch actually writes.
#
# Values are KEY=VALUE (like firewatch.conf); FW_* environment variables or
# --flags on the script override them.
# ============================================================

# Image-storage cap in GiB. When the firewatch JPEGs total more than this, the
# OLDEST frames (rows + JPEG files) are deleted first until back under the cap.
#   "start by 2 GB image storage"
MAX_IMAGES_GB=2

# Row expiry in days: frames older than this (by captured_at) are deleted,
# together with their detections rows and JPEG files.
#   "row expires after 3 months"  (3 * 30 = 90)
ROW_EXPIRE_DAYS=90

# Append-only log written by the cleanup job. Container path; under STORE_DIR
# so it lands in the host media tree next to firewatch.db. Override with the
# FW_LOG_FILE env var or --log-file.
LOG_FILE=/media/firewatch/cleanup.log
