# ============================================================
# Frigate media disk-cap cleanup - tunable settings
# Used by: scripts/cleanup_media.sh (run every 30 min via cron)
#
# The script deletes the OLDEST media files (recordings, clips,
# snapshots) when either trigger below fires:
#   1. media dir usage exceeds MAX_MEDIA_GB, OR
#   2. free space on the media filesystem drops below MIN_FREE_GB
# (set either to 0 to disable that trigger).
#
# NOTE: this file is read by the HOST cron script, not by Frigate.
# If you edit it on this machine, re-deploy it to the host
# (~/frigate/config/cleanup_media.conf) with scp.
# ============================================================

# Absolute path to the Frigate media directory on the HOST
# (the bind mount from docker-compose.yml, i.e. ./media).
MEDIA_DIR=/home/dr/frigate/media

# Soft cap on media dir size in GB. When usage exceeds this,
# the script deletes oldest files first until back under the cap.
# 0 = disabled.
MAX_MEDIA_GB=20

# Minimum free space on the media filesystem in GB. When free space
# drops below this, the script also deletes oldest files first.
# 0 = disabled.
MIN_FREE_GB=5

# Belt-and-suspenders: also delete any media file older than this
# many days on every run, regardless of the caps. 0 = disabled.
# (Frigate's own record.retain.days already expires clips by age,
# so this is only a safety net.)
MAX_AGE_DAYS=0

# Log file where each cleanup run writes one summary line.
LOG_FILE=/home/dr/frigate/media-cleanup.log
