# ============================================================
# Frigate NVR configuration - Phase 0 baseline
# NOTE: Frigate 0.17+ reads this file as config/config.yaml.
# Detector: OpenVINO on CPU (Intel i7-9700)
# Cameras: 10 (9 UNV/VCP + 1 Hikvision)
# MQTT: publish events to local Mosquitto broker (service "mqtt")
#
# CREDENTIALS: NO secrets are stored in this file (safe to commit).
# Frigate 0.17 substitutes environment variables in the camera RTSP
# paths below using Python str.format() on {FRIGATE_...} placeholders
# applied to the ffmpeg input path. The old !env_var YAML tag is NOT
# supported in 0.17 - if used, the literal text is left in the URL.
# The container receives the values from .env (env_file in
# docker-compose.yml), e.g.:
#     FRIGATE_RTSP_USER=admin
#     FRIGATE_RTSP_PASS=REAL_CAMERA_PASSWORD
# The Hikvision cam08 uses SEPARATE credentials
# (FRIGATE_HIK_RTSP_USER / FRIGATE_HIK_RTSP_PASS) because its admin
# password differs from the UNV cameras - using the shared password
# makes ffmpeg fail with "DESCRIBE failed: 401 Unauthorized".
# Edit .env (or .env.example -> .env) to change credentials - never
# edit the paths in this file. See .env.example and README.md.
#
# RECORDING: EVENT-ONLY since Phase 0b. The high-res main streams
# (3200x1800 HEVC @20fps) overwhelmed the CPU when continuously
# decoded for the record role and produced invalid segments, so only
# the lightweight 640x360 detect substreams are pulled. Frigate now
# records video clips from the detect stream ONLY on motion/object
# events (see record block below). Disk-cap cleanup is handled by a
# host cron running scripts/cleanup_media.sh (see cleanup_media.conf).
# ============================================================

# ------------------------------------------------------------------
# IMPORTANT: keep this version in sync with the running Frigate
# (Frigate 0.17.x = "0.17-0"). If `version` is missing, Frigate's
# migrate_frigate_config treats the file as 0.13 and REWRITES
# config.yaml on every fresh start, dropping fields it does not
# understand - including the OpenVINO detector model width/height
# below (which are required to match ssdlite_mobilenet_v2's 300x300
# input). With the version declared, migration is skipped and the
# file is left untouched.
# ------------------------------------------------------------------
version: 0.17-0

mqtt:
  host: mqtt
  port: 1883
  topic_prefix: frigate
  client_id: frigate

# ------------------------------------------------------------------
# Logging
# Frigate writes logs to /config/frigate.log (mounted ./config) and
# to container stdout -> view with: docker compose logs frigate
# Set default: debug while troubleshooting camera/ffmpeg issues.
# ------------------------------------------------------------------
logger:
  default: info

# ------------------------------------------------------------------
# Global FFmpeg options - FORCE SOFTWARE DECODE (no VAAPI/QSV).
# Frigate 0.17 AUTO-DETECTS vaapi ("Automatically detected vaapi
# hwaccel for video decoding") and applies it even when no
# hwaccel_args are set. Hardware decoding of the HEVC camera streams
# on this host crashes ffmpeg (VPS 0 does not exist / Failed to sync
# surface / Failed to download frame: -5), breaking the detect streams
# and yielding zero motion/detection/events (and therefore no
# recordings). An explicit empty `hwaccel_args: []` forces software
# decode, which is reliable on the i7-9700 for 10 substreams at 5fps.
# ------------------------------------------------------------------
ffmpeg:
  hwaccel_args: []

# ------------------------------------------------------------------
# Detection model (TOP-LEVEL) - REQUIRED for the OpenVINO detector.
#
# IMPORTANT (Frigate 0.17): a per-detector `model:` block is
# DISCARDED at load ("users should not set model themselves" in
# frigate/config/config.py). The detector's model (including its
# input width/height) is built from THIS top-level `model:` block,
# with the detector's flat `model_path:` overriding only the path.
#
# MODEL: YOLO11n (Ultralytics COCO 80-class) exported to NMS-free ONNX
# @640 - replaces the bundled ssdlite_mobilenet_v2 (weak at 300x300;
# see plans/replace-coco-with-yolo-on-igpu.md). Frigate 0.17.2 OpenVINO
# detector with model_type: yolo-generic routes to post_process_yolo(),
# which decodes the raw [1,84,8400] output (cxcywh + class scores) and
# applies its own NMS - no OpenVINO IR conversion needed.
#
# width/height MUST match the export imgsz (640) or the detector
# crashes with the 320-vs-300 style shape error. input_tensor: nchw +
# input_dtype: float make Frigate transpose NHWC->NCHW and divide by
# 255 (0..1 RGB), exactly the preprocessing Ultralytics weights expect
# (input_pixel_format defaults to rgb - correct).
#
# Model files live in models/coco/ (git-tracked since 2026-09-06 - this dir is
# mounted read-only at /models in the container => /models/coco). Self-contained
# git deploy. config/ holds only config.
# ------------------------------------------------------------------
model:
  model_type: yolo-generic
  path: /models/coco/yolo11n.onnx
  labelmap_path: /models/coco/labelmap.txt
  width: 640
  height: 640
  input_tensor: nchw
  input_dtype: float

# ------------------------------------------------------------------
# OpenVINO detector (0.17.2 container).
# The flat `model_path:` overrides the model path; model_type / input
# config come from the top-level `model:` block above.
# device: CPU - benchmarked ~17ms avg (YOLO11n@640) vs ~19.5ms on the
# iGPU (plans/replace-coco-with-yolo-on-igpu.md §Results).
# ------------------------------------------------------------------
detectors:
  ov:
    type: openvino
    device: CPU
    model_path: /models/coco/yolo11n.onnx

# ------------------------------------------------------------------
# Objects to track and detection thresholds
# Animal detection Part 1 (plans/animal-motion-detection.md): the
# bundled ssdlite_mobilenet_v2 model already recognizes these COCO
# animal classes, so we only add them to track + per-class filters.
# Farm animals are often small/far, so keep their min_score/threshold
# slightly lower than person. Tune after observing false positives.
# ------------------------------------------------------------------
objects:
  track:
    - person
    - car
    - dog
    - cat
    - bird
    - horse
    - sheep
    - cow
    - motorcycle
    - knife
    - truck
  filters:
    person:
      min_score: 0.5
      threshold: 0.65
    dog:
      min_score: 0.5
      threshold: 0.65
    cat:
      min_score: 0.5
      threshold: 0.65
    bird:
      min_score: 0.7
      threshold: 0.8
    horse:
      min_score: 0.5
      threshold: 0.8
    sheep:
      min_score: 0.5
      threshold: 0.65
    cow:
      min_score: 0.5
      threshold: 0.65
    motorcycle:
      min_score: 0.5
      threshold: 0.65
    knife:
      min_score: 0.5
      threshold: 0.65
    truck:
      min_score: 0.5
      threshold: 0.65   

# ------------------------------------------------------------------
# Recording - EVENT-ONLY (Phase 0b).
# Frigate records a video clip from the detect substream only when
# motion / a tracked object is detected. No continuous recording, so
# CPU and disk stay low. Main high-res streams are NOT pulled (they
# previously overwhelmed the CPU and produced invalid segments).
# Disk-cap backstop: host cron runs scripts/cleanup_media.sh, which
# deletes the oldest media files when usage exceeds the cap defined
# in config/cleanup_media.conf.
# ------------------------------------------------------------------
record:
  enabled: true
  # Frigate 0.17 schema. The pre-0.17 `record.retain` / `record.events`
  # keys are REJECTED by 0.17 ("Extra inputs are not permitted") - if
  # present, the config is invalid and Frigate starts in safe mode with
  # no cameras. Retain alerts + detection clips for 7 days each, with a
  # 3s pre-capture (same intent as the old `retain.default: 7` +
  # `events.pre_capture: 3`).
  alerts:
    retain:
      days: 7
    pre_capture: 3
  detections:
    retain:
      days: 7
    pre_capture: 3

# Snapshots are generated from the detect stream and stay enabled.
snapshots:
  enabled: true
  retain:
    default: 14
  timestamp: true
  bounding_box: true

# ------------------------------------------------------------------
# Motion detection sensitivity (Phase 1 2026-09-06 - slightly LESS sensitive
# to cut spurious triggers from wind/grass/insects on the busy farm scenes,
# which was firing detection on ~every frame. Baseline was stock Frigate:
# threshold 25 / contour_area 10. Per-camera motion.mask polygons can be added
# from the Frigate UI once always-busy regions are identified. cam01 got one on
# 2026-09-07 for a continuously-moving roof object on the upper-left (see the
# cam01 motion.mask below).)
#   threshold: 30     higher = fewer pixels count as motion (LESS sensitive)
#   contour_area: 15  higher = motion must be a bigger blob (LESS sensitive)
#   delta_alpha: 0.2  higher = background adapts faster (LESS sensitive)
# Lower values increase sensitivity -> more motion triggers.
# ------------------------------------------------------------------
motion:
  threshold: 30
  contour_area: 15
  delta_alpha: 0.2
  improve_contrast: false

# ------------------------------------------------------------------
# Cameras - 10 total (detect-only; cam10 added 2026-09-06)
# UNV:       detect substream /media/video2 (640x360@12)
# Hikvision: detect substream /Streaming/Channels/102
# RTSP user/pass come from .env -> container env -> the {FRIGATE_...}
# placeholders in each path below (Frigate 0.17 str.format()).
# Do NOT write plaintext credentials here; change them in .env only.
# Main streams are NOT pulled in Phase 0 (recording disabled).
# ------------------------------------------------------------------
cameras:
  cam01:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASS}@192.168.1.200:554/media/video2
          roles: [detect]
    objects:
      track:
        - person
        - car
        - motorcycle
        - truck
        - knife
        # - dog
        # - cat
        # - horse
        # - sheep
        # - cow
    # ------------------------------------------------------------------
    # MOTION MASK (2026-09-07): continuously-moving object(s) hanging from the
    # roof on the upper-left of the cam01 scene kept motion "active" almost
    # permanently, so Frigate ran full-frame detection on nearly every frame ->
    # high CPU. These 3 polygons make motion inside them IGNORED, so the
    # detector no longer fires for the roof object (only genuine motion
    # elsewhere triggers it). Drawn in the Frigate UI (cam01 -> Edit -> Mask ->
    # Motion) and synced here verbatim from the host config on 2026-09-07.
    # Coordinates are normalized 0..1 of the 640x360 detect frame.
    # Revisit if the object drifts or you miss detections along that edge.
    # ------------------------------------------------------------------
    motion:
      mask:
        - 0.364,0.015,0.323,0.118,0.253,0.281,0.198,0.421,0.144,0.519,0.064,0.594,0.016,0.51,0.008,0.38,0.035,0.198,0.098,0.109,0.223,0.015
        - 0.581,0.074,0.578,0.172,0.576,0.228,0.572,0.29,0.58,0.305,0.591,0.299,0.602,0.249,0.601,0.189,0.597,0.115,0.599,0.072
        - 0.501,0.226,0.528,0.258,0.55,0.244,0.568,0.252,0.608,0.24,0.607,0.273,0.571,0.296,0.533,0.293,0.503,0.273,0.495,0.246
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 1

  cam02:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASS}@192.168.1.201:554/media/video2
          roles: [detect]
    objects:
      track:
        - person
        - car
        - motorcycle
        - truck
        - knife
        # - dog
        # - cat
        # - horse
        # - sheep
        # - cow
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 1

  cam03:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASS}@192.168.1.202:554/media/video2
          roles: [detect]
    objects:
      track:
        - person
        - car
        - motorcycle
        - truck
        - knife
        # - dog
        # - cat
        # - horse
        # - sheep
        # - cow
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 1
    # ------------------------------------------------------------------
    # MOTION MASK (2026-09-07): continuously-moving roof/overhang object on
    # the RIGHT edge of the cam03 scene kept motion active -> detector burn
    # (same issue as cam01). This polygon makes motion inside it IGNORED.
    # Drawn in the Frigate UI (cam03 -> Edit -> Mask -> Motion) and synced here
    # verbatim from the host config on 2026-09-07. Coordinates are normalized
    # 0..1 of the 640x360 detect frame. A frame-diff check confirmed the
    # heaviest persistent-motion cluster (x 0.78-1.0) sits under this mask;
    # other busy areas (top band y<0.11, mid-frame y~0.44-0.72) are left
    # unmasked deliberately until confirmed as nuisance vs real activity.
    # ------------------------------------------------------------------
    motion:
      mask:
        - 0.997,0.302,0.955,0.35,0.896,0.388,0.853,0.43,0.769,0.475,0.742,0.475,0.721,0.528,0.719,0.585,0.725,0.624,0.737,0.665,0.763,0.691,0.792,0.691,0.828,0.647,0.868,0.593,0.919,0.561,0.952,0.511,0.976,0.436,0.997,0.356

  cam04:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASS}@192.168.1.203:554/media/video2
          roles: [detect]
    # Farm view (cows/sheep normally present): ignore all animal detections,
    # track only person and car. This overrides the global objects.track list.
    objects:
      track:
        - person
        - car
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 1

  cam05:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASS}@192.168.1.204:554/media/video2
          roles: [detect]
    # Farm view (cows/sheep normally present): ignore all animal detections,
    # track only person and car. This overrides the global objects.track list.
    objects:
      track:
        - person
        - car
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 1

  cam06:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASS}@192.168.1.205:554/media/video2
          roles: [detect]
    # Farm view (cows/sheep normally present): ignore all animal detections,
    # track only person and car. This overrides the global objects.track list.
    objects:
      track:
        - person
        - car
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 1

  cam07:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASS}@192.168.1.206:554/media/video2
          roles: [detect]
    # Farm view (cows/sheep normally present): ignore all animal detections,
    # track only person and car. This overrides the global objects.track list.
    objects:
      track:
        - person
        - car
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 1

  # ---- Hikvision camera (192.168.1.207) ----
  # Substream (102) resolution is auto-detected by Frigate.
  # Uses SEPARATE credentials (FRIGATE_HIK_RTSP_USER / FRIGATE_HIK_RTSP_PASS)
  # because the Hikvision admin password differs from the UNV cameras - the
  # shared FRIGATE_RTSP_PASS makes ffmpeg fail with "DESCRIBE failed:
  # 401 Unauthorized". Set the real Hikvision password in .env.
  cam08:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_HIK_RTSP_USER}:{FRIGATE_HIK_RTSP_PASS}@192.168.1.207:554/Streaming/Channels/102
          roles: [detect]
    objects:
      track:
        - person
        - car
        - motorcycle
        - knife
        - truck
        # - dog
    detect:
      enabled: true
      fps: 1

  cam09:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASS}@192.168.1.208:554/media/video2
          roles: [detect]
    objects:
      track:
        - person
        - car
        - motorcycle
        - truck
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 1

  cam10:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASS}@192.168.1.209:554/media/video2
          roles: [detect]
    objects:
      track:
        - person
