  # ---- Hikvision camera (192.168.1.207) ----
  # Substream (102) resolution is auto-detected by Frigate.
  # Uses SEPARATE credentials (FRIGATE_HIK_RTSP_USER / FRIGATE_HIK_RTSP_PASS)
  # because the Hikvision admin password differs from the UNV cameras - the
  # shared FRIGATE_RTSP_PASS makes ffmpeg fail with "DESCRIBE failed:
  # 401 Unauthorized". Set the real Hikvision password in .env.
  cam08:
    ffmpeg:
      inputs:
        - path: 
            rtsp://{FRIGATE_HIK_RTSP_USER}:{FRIGATE_HIK_RTSP_PASS}@192.168.1.207:554/Streaming/Channels/102
          roles: [detect]
    objects:
      track:
        - person
        - car
        - motorcycle
        - knife
        - truck
        # - dog
    # ------------------------------------------------------------------
    # MOTION MASK (2026-09-09): always-busy region drawn in the Frigate UI and
    # synced here verbatim from the host config. Motion inside the polygon is
    # IGNORED so the detector no longer fires for that area (only genuine motion
    # elsewhere triggers it). Coordinates are normalized 0..1 of the detect
    # frame. Revisit if you miss detections.
    # ------------------------------------------------------------------
    motion:
      mask: 0.681,0.168,0.899,0.162,1,0.16,0.994,0.004,0.001,0.008,0.003,0.212
    detect:
      enabled: true
      fps: 1

