# ============================================================
# Frigate NVR configuration - Phase 0 baseline
# NOTE: Frigate 0.17+ reads this file as config/config.yaml.
# Detector: OpenVINO on CPU (Intel i7-9700)
# Cameras: 10 (9 UNV/VCP + 1 Hikvision)
# MQTT: publish events to local Mosquitto broker (service "mqtt")
#
# CREDENTIALS: NO secrets are stored in this file (safe to commit).
# Frigate 0.17 substitutes environment variables in the camera RTSP
# paths below using Python str.format() on {FRIGATE_...} placeholders
# applied to the ffmpeg input path. The old !env_var YAML tag is NOT
# supported in 0.17 - if used, the literal text is left in the URL.
# The container receives the values from .env (env_file in
# docker-compose.yml), e.g.:
#     FRIGATE_RTSP_USER=admin
#     FRIGATE_RTSP_PASS=REAL_CAMERA_PASSWORD
# Edit .env (or .env.example -> .env) to change credentials - never
# edit the paths in this file. See .env.example and README.md.
#
# RECORDING: EVENT-ONLY since Phase 0b. The high-res main streams
# (3200x1800 HEVC @20fps) overwhelmed the CPU when continuously
# decoded for the record role and produced invalid segments, so only
# the lightweight 640x360 detect substreams are pulled. Frigate now
# records video clips from the detect stream ONLY on motion/object
# events (see record block below). Disk-cap cleanup is handled by a
# host cron running scripts/cleanup_media.sh (see cleanup_media.conf).
# ============================================================

mqtt:
  host: mqtt
  port: 1883
  topic_prefix: frigate
  client_id: frigate

# ------------------------------------------------------------------
# Logging
# Frigate writes logs to /config/frigate.log (mounted ./config) and
# to container stdout -> view with: docker compose logs frigate
# Set default: debug while troubleshooting camera/ffmpeg issues.
# ------------------------------------------------------------------
logger:
  default: info

# ------------------------------------------------------------------
# OpenVINO CPU detector
# Paths verified inside the Frigate 0.17.2 container:
#   model:    /openvino-model/ssdlite_mobilenet_v2.xml  (bundled)
#   labelmap: /labelmap.txt                             (bundled)
# Explicit paths are required - Frigate 0.17's default OpenVINO
# model path points to a non-bundled model and fails to start.
# ------------------------------------------------------------------
detectors:
  ov:
    type: openvino
    device: CPU
    model:
      path: /openvino-model/ssdlite_mobilenet_v2.xml
      labelmap_path: /labelmap.txt

# ------------------------------------------------------------------
# Objects to track and detection thresholds
# ------------------------------------------------------------------
objects:
  track:
    - person
    - car
  filters:
    person:
      min_score: 0.5
      threshold: 0.7

# ------------------------------------------------------------------
# Recording - EVENT-ONLY (Phase 0b).
# Frigate records a video clip from the detect substream only when
# motion / a tracked object is detected. No continuous recording, so
# CPU and disk stay low. Main high-res streams are NOT pulled (they
# previously overwhelmed the CPU and produced invalid segments).
# Disk-cap backstop: host cron runs scripts/cleanup_media.sh, which
# deletes the oldest media files when usage exceeds the cap defined
# in config/cleanup_media.conf.
# ------------------------------------------------------------------
record:
  enabled: true
  retain:
    default: 7
    mode: active_objects
  events:
    pre_capture: 3
    retain:
      default: 7
      mode: active_objects

# Snapshots are generated from the detect stream and stay enabled.
snapshots:
  enabled: true
  retain:
    default: 14
  timestamp: true
  bounding_box: true

# ------------------------------------------------------------------
# Motion detection sensitivity (Frigate defaults - standard sensitivity)
#   threshold: 25     higher = fewer pixels count as motion (LESS sensitive)
#   contour_area: 10  higher = motion must be a bigger blob (LESS sensitive)
#   delta_alpha: 0.2  higher = background adapts faster (LESS sensitive)
# Lower values increase sensitivity -> more motion triggers.
# ------------------------------------------------------------------
motion:
  threshold: 25
  contour_area: 10
  delta_alpha: 0.2
  improve_contrast: false

# ------------------------------------------------------------------
# Cameras - 10 total (detect-only in Phase 0)
# UNV:       detect substream /media/video2 (640x360@12)
# Hikvision: detect substream /Streaming/Channels/102
# RTSP user/pass come from .env -> container env -> the {FRIGATE_...}
# placeholders in each path below (Frigate 0.17 str.format()).
# Do NOT write plaintext credentials here; change them in .env only.
# Main streams are NOT pulled in Phase 0 (recording disabled).
# ------------------------------------------------------------------
cameras:

  cam01:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASS}@192.168.1.200:554/media/video2
          roles: [detect]
    detect:
      width: 640
      height: 360
      fps: 5

  cam02:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASS}@192.168.1.201:554/media/video2
          roles: [detect]
    detect:
      width: 640
      height: 360
      fps: 5

  cam03:
