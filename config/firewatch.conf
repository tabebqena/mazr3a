# ============================================================
# firewatch - farm fire/smoke watchdog tunables.
#
# Consumed by the `firewatch` Docker service (scripts/firewatch.py),
# which is mounted read-only at /config/firewatch.conf. No secrets here
# (Telegram creds live in the git-ignored config/telegram.conf).
#
# Every value can be overridden by a same-named environment variable on
# the firewatch service (docker-compose.yml `environment:`), which wins.
#
# Edit on the host and restart the service to apply - no image rebuild:
#     docker compose restart firewatch
# ============================================================

# Cameras to watch (comma-separated, exact Frigate camera names).
CAMERAS=cam01,cam02,cam03,cam04,cam05,cam06,cam07,cam08,cam09,cam10

# Master switch. false keeps the container running but stops polling
# (handy to pause without a rebuild/scale).
ENABLED=true

# Seconds between full sweeps. One sweep checks every camera once, so each
# camera is sampled roughly every (sweep_time + POLL_INTERVAL_S). With 10
# cameras and 15 s the worst-case revisit gap is ~2-3 minutes - lower it
# (e.g. 5) if you want sub-minute latency on the highest-risk camera, at a
# small extra CPU cost.
POLL_INTERVAL_S=15

# Frigate API base URL (compose service name) + container paths.
FRIGATE_API=http://frigate:5000
TELEGRAM_CONF=/config/telegram.conf
MODEL_DIR=/models/fire

# Detection gating.
#   SCORE_THRESHOLD  minimum class score for a box to count as a hit
#   MIN_HITS         consecutive poll hits required before alerting
#                    (transient false-positive guard)
#   COOLDOWN_S       seconds a camera stays silent after an alert (no spam)
SCORE_THRESHOLD=0.5
MIN_HITS=3
COOLDOWN_S=300

# Track fire only (false) or fire + smoke (true). Smoke is false-positive
# prone on a farm (steam, dust, haze, IR) - start with fire only, then
# enable smoke cautiously and watch the logs.
TRACK_SMOKE=false
