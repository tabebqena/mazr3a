# ============================================================
# firewatch - farm fire/smoke watchdog tunables.
#
# Consumed by the `firewatch` Docker service (firewatch/firewatch.py,
# mounted at /firewatch/firewatch.py in the container), which reads this
# file read-only at /config/firewatch.conf. No secrets here
# (Telegram creds live in the git-ignored config/telegram.conf).
#
# Every value can be overridden by a same-named environment variable on
# the firewatch service (docker-compose.yml `environment:`), which wins.
#
# Edit on the host and restart the service to apply - no image rebuild:
#     docker compose restart firewatch
#
# NOTE: KEY=VALUE parser treats everything after '=' as the value, so
# comments must live on their OWN line (never after a value).
# ============================================================

# Cameras to watch (comma-separated, exact Frigate camera names).
CAMERAS=cam01,cam02,cam03,cam04,cam05,cam06,cam07,cam08,cam09

# Master switch. false keeps the container running but stops polling
# (handy to pause without a rebuild/scale).
ENABLED=true

# Liveness heartbeat: a healthy watcher with no fire logs NOTHING between
# events, so every HEARTBEAT_S seconds it prints one summary line
# ("heartbeat: modes={...} ...") to prove the poll loop is alive.
HEARTBEAT_S=300

# Frigate API base URL (compose service name) + container paths.
FRIGATE_API=http://frigate:5000
TELEGRAM_CONF=/config/telegram.conf
MODEL_DIR=/models/fire

# ====================================================================
# v3 MOTION-GATED POLLING + SPATIAL CONFIRMATION (2026-09-09, established
# spec: plans/firewatch-motion-gate-bonus.md).
#
# firewatch fuses the fire model's per-box confidence with MOTION measured on
# two frames pulled ~MOTION_GAP_S apart. Motion GATES the model (a batched
# sweep runs inference only where the motion gate passed or a baseline is due)
# and is an EVIDENCE TIER: a box NEAR motion confirms at SCORE_THRESHOLD with a
# MOTION_BONUS; a box with NO nearby motion gets no bonus and must clear
# SCORE_HIGH. A hit promotes the camera to a dense FOLLOW-UP that alerts on
# MIN_HITS confirms within HITS_WINDOW dense samples. COOLDOWN follows ANY
# follow-up exit - alert or not. The values below are fixed by the spec.
# ====================================================================

# --- Poll cycle ------------------------------------------------------------
# A batched two-frame sweep covers all cameras every POLL_INTERVAL_S; the model
# runs only on cameras whose motion gate passed or whose baseline is due.
POLL_INTERVAL_S=15

# Seconds between the two motion frames of a sweep (A then B).
MOTION_GAP_S=1.5

# Short latest.jpg timeout so a sweep stays tight.
MOTION_FETCH_TIMEOUT_S=1.0

# Accept a camera's motion diff only when its A->B gap is within [min, max]
# (skip the camera otherwise).
MOTION_GAP_MIN_S=0.5
MOTION_GAP_MAX_S=5.0

# --- Motion measurement ----------------------------------------------------
# Gaussian blur kernel before diffing.
MOTION_DENOISE_KERNEL=3

# |grayA - grayB| above this = a pixel changed (day).
MOTION_PIXEL_DIFF=18

# Frame mean luma below this = night (ISO/IR noise is higher at night).
MOTION_NIGHT_LUMA=25

# Night pixel-diff (used when the mean luma < MOTION_NIGHT_LUMA).
MOTION_PIXEL_DIFF_NIGHT=26

# Minimum changed-pixel fraction to pass the motion gate.
MOTION_FRAME_FRAC=0.0015

# Above this changed fraction = a GLOBAL change (auto-exposure / white-balance
# / camera shake), which is NOT usable motion.
MOTION_FRAME_FRAC_MAX=0.20

# Keep recent motion masks this many samples (hotspot bridging for slow smoke).
MOTION_PERSIST_TURNS=2

# --- Model gating / spatial agreement --------------------------------------
# Raw detect floor (the model runs at this when it runs).
SCORE_FLOOR=0.35

# Run the model regardless of motion this often (still/slow fire fallback).
BASELINE_EVERY_S=120

# Expand a fire box by this fraction of its size per side when measuring
# whether motion is NEAR it (not byte-exact agreement).
MOTION_MARGIN=0.5

# Changed-pixel fraction in the expanded box that makes the box "near motion".
MOTION_NEAR_FRAC=0.02

# ... or at least this many changed pixels (small / distant boxes).
MOTION_NEAR_MIN_PX=15

# Confidence added when a box is near motion (effective = raw + bonus).
MOTION_BONUS=0.15

# Alert bar for a near-motion (bonused) fire; also the evidence-storage bar.
SCORE_THRESHOLD=0.50

# Alert bar for a fire with NO nearby motion (no bonus is given).
SCORE_HIGH=0.85

# --- Follow-up confirmation + cooldown -------------------------------------
# Dense samples for a promoted (FOLLOW) camera, between sweeps.
FOLLOWUP_GAP_S=5

# Cap a follow-up session.
FOLLOWUP_MAX_S=90

# Unconfirmed exit after this many consecutive empty follow-up samples.
FOLLOW_DEATH_TURNS=4

# A camera alerts when MIN_HITS confirms occur within the last HITS_WINDOW
# dense follow-up samples.
MIN_HITS=3
HITS_WINDOW=4

# Per-camera quiet after a confirmed alert.
COOLDOWN_S=300

# Per-camera quiet after an unconfirmed follow-up exit (no alert).
COOLDOWN_NOALERT_S=60

# --- Master switch ---------------------------------------------------------
# MOTION_ENABLED=true  -> v3 motion-gated pipeline above (default).
# MOTION_ENABLED=false -> previous score-only polling: every camera every poll
#                         at SCORE_THRESHOLD, MIN_HITS/HITS_WINDOW
#                         accumulation, COOLDOWN_S after an alert.
MOTION_ENABLED=true

# Track fire only (false) or fire + smoke (true). Smoke is false-positive
# prone on a farm (steam, dust, haze, IR) - start with fire only, then
# enable smoke cautiously and watch the logs.
TRACK_SMOKE=false

# Evidence store (2026-09-08; sqlite rework, see
# plans/firewatch-sqlite-evidence-store.md): firewatch persists every poll that
# is marked fire (a detection whose effective score is above SCORE_THRESHOLD),
# INDEPENDENT of the alert gate and cooldown - so a real fire that never
# accumulates enough hits still leaves a durable record. Each stored frame = a
# JPEG (the fetched detect snapshot, kept as a plain file under
# <STORE_DIR>/<cam>/) + its metadata (camera, timestamp, best score, per-box
# detections, the image PATH) in a single WAL-mode SQLite DB at
# <STORE_DIR>/firewatch.db - the old per-frame .json sidecar is gone.
#
# v3 (2026-09-09): each stored frame writes TWO JPEGs sharing one timestamped
# base - <base>.jpg (the ORIGINAL frame the model scored; canonical
# frames.jpg_path) and <base>_annotated.jpg (red boxes + label + score;
# frames.annotated_path). Retention/cleanup deletes both files together.
#
#   STORE_DIR             writable directory inside the container.
#                         docker-compose mounts the git-ignored host ./media
#                         dir read-write at /media/firewatch. JPEGs land in
#                         <STORE_DIR>/<cam>/ and the DB in <STORE_DIR>/<STORE_DB>.
#   STORE_DB              evidence DB filename inside STORE_DIR (default
#                         firewatch.db; WAL mode, images NOT stored in it).
#   STORE_RETENTION_DAYS  0 = keep every record (default). >0 prunes frame
#                         records + their detections older than N days,
#                         opportunistically (~once a minute). Rows only - the
#                         JPEG files stay (host media cleanup owns file
#                         purging) and the DB keeps its size until a manual
#                         VACUUM.
#   STORE_ENABLED         master switch; false = old behavior (no evidence).
STORE_DIR=/media/firewatch
STORE_DB=firewatch.db
STORE_RETENTION_DAYS=0
STORE_ENABLED=true

# Each stored frame row is tagged `alerted` (0/1) when the same poll also
# crossed the alert gate and produced a Telegram alert (web-portal change).
# The portal separates real alerts from raw fire detections using this flag.
# Existing rows default to 0 (not alerted).
#
# OWNERSHIP (2026-09-12 evidence-loss incident, see
# plans/firewatch-store-readonly-recovery.md): the DB and its -wal/-shm
# sidecars MUST be writable by the CONTAINER user (uid 1000). SQLite's WAL
# sidecars belong to whoever CREATED them, and a host-side read of the live DB
# - even a read-only `mode=ro` one - creates them as that host user, after
# which every firewatch write fails with "attempt to write a readonly
# database" while Telegram alerts keep going out: the fire event then NEVER
# appears in the portal and nothing looks broken. firewatch probes the store
# at startup (one loud ERROR if it cannot write), self-heals an EMPTY foreign
# -wal/-shm, and never deletes a NON-empty one. Read the DB through the
# container (`docker exec firewatch ...`), never from the host.
# Repair:  sudo chown 1000:1000 media/firewatch.db media/firewatch.db-wal \
#                                     media/firewatch.db-shm
# Lost frames: scripts/backfill_firewatch_store.py (dry-run, then --commit).
