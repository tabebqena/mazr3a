# ============================================================
# firewatch - farm fire/smoke watchdog tunables.
#
# Consumed by the `firewatch` Docker service (firewatch/firewatch.py,
# mounted at /firewatch/firewatch.py in the container), which reads this
# file read-only at /config/firewatch.conf. No secrets here
# (Telegram creds live in the git-ignored config/telegram.conf).
#
# Every value can be overridden by a same-named environment variable on
# the firewatch service (docker-compose.yml `environment:`), which wins.
#
# Edit on the host and restart the service to apply - no image rebuild:
#     docker compose restart firewatch
# ============================================================

# Cameras to watch (comma-separated, exact Frigate camera names).
CAMERAS=cam01,cam02,cam03,cam04,cam05,cam06,cam07,cam08,cam09

# Master switch. false keeps the container running but stops polling
# (handy to pause without a rebuild/scale).
ENABLED=true

# Seconds between full sweeps. One sweep checks every camera once, so each
# camera is sampled roughly every (sweep_time + POLL_INTERVAL_S). With 10
# cameras and 15 s the worst-case revisit gap is ~2-3 minutes - lower it
# (e.g. 5) if you want sub-minute latency on the highest-risk camera, at a
# small extra CPU cost.
POLL_INTERVAL_S=15

# Liveness heartbeat (2026-09-09, plans/firewatch-heartbeat-logging.md):
# firewatch only logs on events (fire hits, alerts, errors, recoveries), so a
# healthy watcher with no fire is SILENT in `docker logs` - indistinguishable
# from a dead one. Every HEARTBEAT_S seconds it prints one summary line
# ("heartbeat: N/9 cams OK, M fire-marked camera(s) this sweep ...") to prove
# the poll loop is alive. 0 = default 300s (clamped >=60s to prevent spam).
HEARTBEAT_S=300

# Frigate API base URL (compose service name) + container paths.
FRIGATE_API=http://frigate:5000
TELEGRAM_CONF=/config/telegram.conf
MODEL_DIR=/models/fire

# Detection gating.
#   SCORE_THRESHOLD  minimum class score for a box to count as a hit
#   MIN_HITS         fire/smoke poll hits (out of the last HITS_WINDOW) needed
#                    before alerting (transient false-positive guard)
#   HITS_WINDOW      number of recent polls considered. Equal to MIN_HITS =
#                    strictly-consecutive hits (legacy). Larger = tolerates the
#                    single-frame misses a close-up fire causes (auto-exposure
#                    swings), so a real fire still alerts instead of resetting
#                    forever (2026-09-06 fix).
#   COOLDOWN_S       seconds a camera stays silent after an alert (no spam)
# >>> PRODUCTION GATE (2026-09-06 - live-fire verification COMPLETE).
# >>> cam01 true-positive Telegram alert confirmed live 15:05 UTC (larger
# >>> fire: conf 0.52-0.69). Smaller / frame-edge fires score <0.5 on these
# >>> 640x360 scenes and will NOT alert (model recall limit - see
# >>> plans/fire-detection.md 2026-09-06 verification notes). cam03 produced
# >>> repeated sub-0.75 "fire" FALSE POSITIVES on its scene (sun/objects);
# >>> MIN_HITS=3 / HITS_WINDOW=5 raises the evidence bar to cut those.
SCORE_THRESHOLD=0.5
MIN_HITS=3
HITS_WINDOW=5
COOLDOWN_S=300

# Track fire only (false) or fire + smoke (true). Smoke is false-positive
# prone on a farm (steam, dust, haze, IR) - start with fire only, then
# enable smoke cautiously and watch the logs.
TRACK_SMOKE=false

# Evidence store (2026-09-08; sqlite rework, see
# plans/firewatch-sqlite-evidence-store.md): firewatch persists EVERY poll that
# is marked fire (a detection above SCORE_THRESHOLD), INDEPENDENT of the
# MIN_HITS/HITS_WINDOW alert gate and cooldown - so a real fire that never
# accumulates enough hits still leaves a durable record. Each stored frame = a
# JPEG (the fetched detect snapshot, kept as a plain file under
# <STORE_DIR>/<cam>/) + its metadata (camera, timestamp, best score, per-box
# detections, the image PATH) in a single WAL-mode SQLite DB at
# <STORE_DIR>/firewatch.db - the old per-frame .json sidecar is gone.
#
#   STORE_DIR             writable directory inside the container.
#                         docker-compose mounts the git-ignored host ./media
#                         dir read-write at /media/firewatch (subdir firewatch/
#                         of Frigate's media tree). JPEGs land in
#                         <STORE_DIR>/<cam>/YYYYMMDD_HHMMSS_<cam>_conf<best>.jpg
#                         and the DB in <STORE_DIR>/<STORE_DB>.
#   STORE_DB              evidence DB filename inside STORE_DIR (default
#                         firewatch.db; WAL mode, images NOT stored in it).
#   STORE_RETENTION_DAYS  0 = keep every record (default). >0 prunes frame
#                         records + their detections older than N days,
#                         opportunistically (~once a minute). Rows only - the
#                         JPEG files stay (host media cleanup owns file
#                         purging) and the DB keeps its size until a manual
#                         VACUUM.
#   STORE_ENABLED         master switch; false = old behavior (no evidence).
STORE_DIR=/media/firewatch
STORE_DB=firewatch.db
STORE_RETENTION_DAYS=0
STORE_ENABLED=true

# Each stored frame row is tagged `alerted` (0/1) when the same poll also
# crossed the MIN_HITS/HITS_WINDOW gate and produced a Telegram alert
# (2026-09-08, web-portal change). The portal separates real alerts from raw
# fire detections using this flag. Existing rows default to 0 (not alerted).
