# ============================================================
# Unified disk heartbeat - CENTRAL global-cap config.
# Used by: scripts/heartbeat_cleanup.py (host, run as root via cron -
#          see scripts/crontab.sample). This is the ONE cleaner that
#          replaces scripts/cleanup_media.sh + the firewatch-only cron
#          line; firewatch evidence stays DB-aware and is delegated to
#          its in-container worker through a config/stores/firewatch.conf
#          profile of TYPE=docker-exec.
#
# Per-service rules live in SEPARATE files under config/stores/
# (<service>.conf, one per service that writes files). Each profile
# tells the heartbeat how to clean that service's own files (max size /
# max age) and where they are. The GLOBAL cap below decides WHEN the
# heartbeat escalates to freeing space across services.
#
# Values are KEY=VALUE (like firewatch.conf / cleanup_media.conf).
# The token {DEPLOY} expands to the repo/deploy root (parent of the
# scripts/ dir); override the root with the HEARTBEAT_DEPLOY env var.
# Each key can also be overridden by a same-named HEARTBEAT_* env var.
# ============================================================

# Filesystem to watch (any path that lives on the disk under scrutiny).
# Everything here lives under the host deploy root on one disk, so the
# repo root is the natural filesystem probe. This is where the global
# cap is measured.
FS_PATH={DEPLOY}

# ---- Global-cap triggers (Phase 2 escalation) -------------------
# When EITHER is true the heartbeat stops just "compliance" and starts
# freeing space across services (oldest first, in config/stores/*.conf
# PRIORITY order). 0 disables that trigger.
#   MIN_FREE_GB    - free space on FS_PATH falls below this (GiB)
#   MAX_USED_PCT   - used percent on FS_PATH reaches this (%)
MIN_FREE_GB=8
MAX_USED_PCT=0

# Once escalation is needed, keep deleting oldest files until free space
# on FS_PATH is back above RELIEF_FREE_GB (GiB). Set a little above
# MIN_FREE_GB so the heartbeat doesn't thrash on the boundary.
RELIEF_FREE_GB=12

# ---- Per-store compliance (Phase 1) -----------------------------
# Runs on EVERY tick regardless of the global cap: each enabled store
# profile in STORES_DIR enforces its own MAX_AGE_DAYS and MAX_SIZE_GB.
# If you only want the global-cap behaviour, leave every store's
# MAX_AGE_DAYS/MAX_SIZE_GB at 0.

# Directory holding the per-service store profiles (one <service>.conf).
STORES_DIR={DEPLOY}/config/stores

# Append-only heartbeat log (one summary line per run).
LOG_FILE={DEPLOY}/heartbeat-cleanup.log

# ---- Runtime safety -------------------------------------------------
# REQUIRE_ROOT=1 aborts a real (non --dry-run/--check) run unless euid==0,
# because deleting root-owned service dirs (e.g. Frigate media) needs it.
REQUIRE_ROOT=1

# Telegram alert on Phase-2 escalation / pre-flight failure (1) or not (0).
# Credentials are read from TELEGRAM_CONF via scripts/telegram_notify.py.
NOTIFY_TELEGRAM=1
TELEGRAM_CONF={DEPLOY}/config/telegram.conf
