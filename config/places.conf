# ============================================================
# places.conf - the HUMAN layer over Frigate's identifiers.
#
# WHO OWNS WHAT
#   * Frigate owns the CAMERA names (cam01..cam10, from `cameras:` in
#     config/config.yaml) and the ZONES it defines. We never rename or duplicate
#     them; this file only TRANSLATES them into the words a person would say.
#   * This file therefore holds the only place names in the system, plus the
#     walking routes used to link one person across cameras.
#
# Read by scenereader (scenereader/episodes.py `Places`). No secrets here, so it
# IS tracked in git. Edit it and `docker compose restart scenereader`; episodes
# are then rebuilt from the stored events (no re-capture, no model run).
#
# NOTE: the KEY=VALUE parser treats everything after '=' as the value, so a
# comment must live on its OWN line.
# ============================================================

# ------------------------------------------------------------------
# CAMERA_PLACES - camera name -> the place an operator would name.
#
# FILL THIS IN. Any camera left out still works: its descriptions fall back to
# the raw camera name ("cam02") and the service logs it in reader_status.json /
# at startup so nothing is silently wrong.
#
# Example (replace with the real farm):
#   CAMERA_PLACES=cam01=Gate,cam02=Main road,cam03=Yard,cam04=Field 1,cam05=Field 1 south,cam06=Barn,cam07=Store,cam08=Workshop,cam09=Farmhouse,cam10=Back field
# ------------------------------------------------------------------
CAMERA_PLACES=cam01=Gate,cam02=Main road,cam03=Yard,cam04=Field 1,cam05=Field 1 south,cam06=Barn,cam07=Store,cam08=Workshop,cam09=Farmhouse,cam10=Back field

# ------------------------------------------------------------------
# ZONE_PLACES - a finer place inside ONE camera, keyed `camera.zone`.
# Optional, and it WINS over CAMERA_PLACES when the zone is in the event.
#
# Zones are defined in Frigate (UI -> camera -> Zones), exactly like the motion
# masks already in config/config.yaml. Until zones exist, events carry
# `zones: []` and only CAMERA_PLACES applies.
#
# Example:
#   ZONE_PLACES=cam04.north=Field 1 north,cam04.south=Field 1 south,cam07.door=Store entrance
# ------------------------------------------------------------------
ZONE_PLACES=

# ------------------------------------------------------------------
# ADJACENCY - the plausible walking route between cameras, as `A>B` pairs.
# THIS IS WHAT LETS ONE PERSON CROSS CAMERAS AND STAY ONE PERSON.
# Pairs are directed but treated as undirected. Add a pair for every hop that is
# realistic within REID_MAX_GAP_S (config/scenereader.conf); do NOT connect
# places that are far apart, or two different people can be merged.
#
# Example:  ADJACENCY=cam01>cam02,cam02>cam03,cam03>cam04,cam04>cam05,cam03>cam06,cam06>cam07,cam07>cam08,cam08>cam09,cam09>cam10
# ------------------------------------------------------------------
ADJACENCY=

# ------------------------------------------------------------------
# PLACE_COORDS - OPTIONAL rough plan coordinates, `place:x,y;place:x,y`.
# Only used when ADJACENCY is EMPTY: adjacency is then derived from straight-line
# distance between the two resolved places (a simpler but blunter alternative to
# listing the routes explicitly).
#
# Example:  PLACE_COORDS=Gate:0,0;Main road:20,5;Yard:40,10;Field 1:60,25;Store:90,40
# ------------------------------------------------------------------
PLACE_COORDS=

# ------------------------------------------------------------------
# PLACE_AR - the Arabic name of each place, `English=Arabic` pairs.
#
# Every episode narrative is written TWICE from the same facts: an English
# sentence and an Arabic one (episodes.narrative / episodes.narrative_ar). The
# Arabic text is composed deterministically - no model, no translation service -
# so this table is what makes it read naturally.
#
# A place with no entry here is NOT an error: the Arabic sentence simply carries
# the English name for it, so this table can be filled in gradually.
#
# Example:
#   PLACE_AR=Gate=البوابة,Main road=الطريق الرئيسي,Yard=الساحة,Field 1=الحقل 1,Field 1 south=الحقل 1 الجنوبي,Barn=الحظيرة,Store=المخزن,Workshop=الورشة,Farmhouse=بيت المزرعة,Back field=الحقل الخلفي
# ------------------------------------------------------------------
PLACE_AR=Gate=البوابة,Main road=الطريق الرئيسي,Yard=الساحة,Field 1=الحقل 1,Field 1 south=الحقل 1 الجنوبي,Barn=الحظيرة,Store=المخزن,Workshop=الورشة,Farmhouse=بيت المزرعة,Back field=الحقل الخلفي
