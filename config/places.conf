# ============================================================
# places.conf - the HUMAN layer over Frigate's identifiers.
#
# WHO OWNS WHAT
#   * Frigate owns the CAMERA names (cam01..cam10, from `cameras:` in
#     config/config.yaml) and the ZONES it defines. We never rename or duplicate
#     them; this file only TRANSLATES them into the words a person would say.
#   * This file therefore holds the only place names in the system, plus the
#     walking routes used to link one person across cameras.
#
# Read by scenereader (scenereader/episodes.py `Places`). No secrets here, so it
# IS tracked in git. Edit it and `docker compose restart scenereader`; episodes
# are then rebuilt from the stored events (no re-capture, no model run).
#
# NOTE: the KEY=VALUE parser treats everything after '=' as the value, so a
# comment must live on its OWN line.
# ============================================================

# ------------------------------------------------------------------
# CAMERA_PLACES - camera name -> the place an operator would name.
#
# This is the COARSE fallback, used when an event carries no zone (or a zone that
# ZONE_PLACES below does not translate). A camera left out still works: its
# descriptions fall back to the raw camera name ("cam02") and the service logs it
# in reader_status.json and at startup, so nothing is silently wrong.
#
# SEEDED 2026-09-10 from the zones now defined in Frigate (see ZONE_PLACES):
# cam01/02/03/06/09 use their dominant zone area; cam04/05/07/08/10 had no zones
# yet and keep the earlier placeholder names - REVIEW AND RENAME those.
# ------------------------------------------------------------------
CAMERA_PLACES=cam01=Estraha,cam02=Solar panels,cam03=Hoash,cam04=Field 1,cam05=Field 1 south,cam06=Housh 2,cam07=Store,cam08=Workshop,cam09=Field west,cam10=Back field

# ------------------------------------------------------------------
# ZONE_PLACES - a finer place inside ONE camera, keyed `camera.zone`.
# It WINS over CAMERA_PLACES whenever the event carries that zone, which is what
# makes a sentence say "Diwan 1" instead of just "Estraha".
#
# Zones are owned and drawn in FRIGATE (UI -> camera -> Zones) and are stored in
# config/config.yaml, which this repo now tracks as the CANONICAL copy (adopted
# verbatim from the host on 2026-09-10 so a deploy can never overwrite them).
# The keys below are the real zone keys; the right-hand side is the wording used
# in the narrative.
#
# To see them again on the host:
#   python3 -c "import yaml;d=yaml.safe_load(open('config/config.yaml'));[print(c, list(v.get('zones') or {})) for c,v in d['cameras'].items() if v.get('zones')]"
# ------------------------------------------------------------------
ZONE_PLACES=cam01.diwan1=Diwan 1,cam01.diwan2=Diwan 2,cam01.estraha_door=Estraha Door,cam01.estraha_front=Estraha Front,cam01.estraha_road=Estraha Road,cam02.solar_panels=Solar panels,cam03.zone_a3829a54=Field 2.5,cam03.hoash_door_1=Hoash Door 1,cam03.estraha_road_2=Estraha Road 2,cam06.housh_2_door=Housh 2 Door,cam09.field_west=Field West

# ------------------------------------------------------------------
# ADJACENCY - the plausible walking route between cameras, as `A>B` pairs.
# THIS IS WHAT LETS ONE PERSON CROSS CAMERAS AND STAY ONE PERSON.
# Pairs are directed but treated as undirected. Add a pair for every hop that is
# realistic within REID_MAX_GAP_S (config/scenereader.conf); do NOT connect
# places that are far apart, or two different people can be merged.
#
# Example:  ADJACENCY=cam01>cam02,cam02>cam03,cam03>cam04,cam04>cam05,cam03>cam06,cam06>cam07,cam07>cam08,cam08>cam09,cam09>cam10
# ------------------------------------------------------------------
# *** ADJACENCY IS STILL EMPTY: CROSS-CAMERA LINKING IS OFF UNTIL YOU SET IT ***
#
# Until at least one route exists here, every camera produces its OWN episode, so
# a person walking from one camera to the next yields two short stories instead of
# one. This is deliberate: a WRONG route silently merges two different people,
# which is worse than no link at all. Set only hops a person can realistically
# make within REID_MAX_GAP_S (config/scenereader.conf, default 90 s).
#
# TENTATIVE STARTING POINT, derived from the zone names ("Estraha Road" appears on
# cam01 and cam03, "Hoash/Housh" on cam03 and cam06) - UNCOMMENT AND VERIFY
# against the actual layout:
#   ADJACENCY=cam01>cam03,cam03>cam02,cam03>cam06,cam03>cam04,cam04>cam05
ADJACENCY=

# ------------------------------------------------------------------
# PLACE_COORDS - OPTIONAL rough plan coordinates, `place:x,y;place:x,y`.
# Only used when ADJACENCY is EMPTY: adjacency is then derived from straight-line
# distance between the two resolved places (a simpler but blunter alternative to
# listing the routes explicitly).
#
# Example:  PLACE_COORDS=Gate:0,0;Main road:20,5;Yard:40,10;Field 1:60,25;Store:90,40
# ------------------------------------------------------------------
PLACE_COORDS=

# ------------------------------------------------------------------
# PLACE_AR - the Arabic name of each place, `English=Arabic` pairs.
#
# Every episode narrative is written TWICE from the same facts: an English
# sentence and an Arabic one (episodes.narrative / episodes.narrative_ar). The
# Arabic text is composed deterministically - no model, no translation service -
# so this table is what makes it read naturally.
#
# A place with no entry here is NOT an error: the Arabic sentence simply carries
# the English name for it, so this table can be filled in gradually.
#
# Every place named above (camera-level AND zone-level) should have an entry, or
# the Arabic sentence simply keeps the English name for it.
# ------------------------------------------------------------------
PLACE_AR=Estraha=الاستراحة,Diwan 1=الديوان 1,Diwan 2=الديوان 2,Estraha Door=باب الاستراحة,Estraha Front=أمام الاستراحة,Estraha Road=طريق الاستراحة,Solar panels=الألواح الشمسية,Hoash=الحوش,Field 2.5=الحقل 2.5,Hoash Door 1=باب الحوش 1,Estraha Road 2=طريق الاستراحة 2,Housh 2=الحوش 2,Housh 2 Door=باب الحوش 2,Field west=الحقل الغربي,Field West=الحقل الغربي,Field 1=الحقل 1,Field 1 south=الحقل 1 الجنوبي,Store=المخزن,Workshop=الورشة,Back field=الحقل الخلفي
