# ============================================================
# portal - web portal (FastAPI + SPA) default tunables.
#
# This file is TRACKED and ships with the repo (no secrets here).
# The session SECRET_KEY is injected from the git-ignored
# portal/.env (SECRET_KEY=...) via the portal service's env_file.
# Full option documentation lives in config/portal.conf.example.
# ============================================================

# Session cookie lifetime (days) and whether the cookie is Secure-only.
SESSION_DAYS=7
COOKIE_SECURE=false

# Live-view idle time watch: stop the stream after this many seconds of
# user inactivity (mouse/touch/keyboard resets the clock).
STREAM_IDLE_TIMEOUT_S=300

# Landing camera when the user has no per-user default_camera.
DEFAULT_CAMERA=cam01

FRIGATE_API=http://frigate:5000

# firewatch evidence: DB path + stored-jpg prefix remap.
FIREWATCH_DB=/media/firewatch.db
FIREWATCH_JPG_PREFIX=/media/firewatch/
FIREWATCH_JPG_REPLACE=/media/

# ------------------------------------------------------------------
# PTZ: autodetection probes every Frigate camera host over ONVIF and caches
# the PTZ camera name/host/profile in PTZ_DETECTED_FILE. Startup runs it only
# when the cache is absent; Manage can rerun it. PTZ_CAMERA / PTZ_HOST /
# PTZ_ONVIF_PROFILE are explicit overrides (blank = use autodetection).
# Credentials are NOT in this file - they come from the root .env
# (FRIGATE_HIK_RTSP_USER/PASS for ISAPI presets and PTZ_ONVIF_USER/PASS for
# ONVIF movement). Preset positions live in camera preset slots;
# PTZ_PRESETS_FILE stores our names/metadata, namespaced per camera
# (portal/ptz.py). Manual movement uses ONVIF ContinuousMove with a
# whole-second camera-enforced Timeout: while held, the browser repeats one
# bounded pulse every PTZ_ONVIF_TIMEOUT_S + PTZ_ONVIF_GAP_S.
# Set PTZ_MOVE_BACKEND=isapi only as a fallback; this firmware ignores the
# ISAPI momentary duration.
# ------------------------------------------------------------------
PTZ_ENABLED=true
PTZ_CAMERA=
PTZ_HOST=
PTZ_PORT=80
PTZ_SCHEME=http
PTZ_CHANNEL=1
PTZ_VERIFY_TLS=false
PTZ_AUTODETECT=true
PTZ_DETECTED_FILE=/media/portal/ptz_detected.json
PTZ_DETECT_TIMEOUT_S=2
PTZ_MOVE_BACKEND=onvif
PTZ_ONVIF_PROFILE=
PTZ_ONVIF_TIMEOUT_S=1
PTZ_ONVIF_GAP_S=0
PTZ_MOMENTARY_MS=400
PTZ_HOLD_MAX_S=2
PTZ_PRESETS_FILE=/media/portal/ptz_presets.json
