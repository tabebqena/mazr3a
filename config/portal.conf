# ============================================================
# portal - web portal (FastAPI + SPA) default tunables.
#
# This file is TRACKED and ships with the repo (no secrets here).
# The session SECRET_KEY is injected from the git-ignored
# portal/.env (SECRET_KEY=...) via the portal service's env_file.
# Full option documentation lives in config/portal.conf.example.
# ============================================================

# Session cookie lifetime (days) and whether the cookie is Secure-only.
SESSION_DAYS=7
COOKIE_SECURE=false

# Live-view idle time watch: stop the stream after this many seconds of
# user inactivity (mouse/touch/keyboard resets the clock).
STREAM_IDLE_TIMEOUT_S=300

# Landing camera when the user has no per-user default_camera.
DEFAULT_CAMERA=cam01

FRIGATE_API=http://frigate:5000

# firewatch evidence: DB path + stored-jpg prefix remap.
FIREWATCH_DB=/media/firewatch.db
FIREWATCH_JPG_PREFIX=/media/firewatch/
FIREWATCH_JPG_REPLACE=/media/

# ------------------------------------------------------------------
# PTZ: comma-separated Frigate camera names with PTZ hardware. Each host is
# resolved from Frigate's go2rtc.streams.<cam>; PTZ_HOST is only the fallback
# for a single camera. Credentials are NOT in this file - they come from the
# root .env (FRIGATE_HIK_RTSP_USER/PASS) via the portal service's env_file.
# Preset positions live in camera preset slots; PTZ_PRESETS_FILE stores our
# names/metadata, namespaced per camera (portal/ptz.py). Manual movement uses
# ONVIF ContinuousMove with a whole-second camera-enforced Timeout: the browser
# sends one bounded pulse and then waits PTZ_ONVIF_TIMEOUT_S + PTZ_ONVIF_GAP_S
# before the next one. Set PTZ_MOVE_BACKEND=isapi only as a fallback; this
# firmware ignores the ISAPI momentary duration.
# ------------------------------------------------------------------
PTZ_ENABLED=true
PTZ_CAMERA=cam08
PTZ_HOST=192.168.1.207
PTZ_PORT=80
PTZ_SCHEME=http
PTZ_CHANNEL=1
PTZ_VERIFY_TLS=false
PTZ_MOVE_BACKEND=onvif
PTZ_ONVIF_PROFILE=Profile_1
PTZ_ONVIF_TIMEOUT_S=1
PTZ_ONVIF_GAP_S=0
PTZ_MOMENTARY_MS=400
PTZ_HOLD_MAX_S=2
PTZ_PRESETS_FILE=/media/portal/ptz_presets.json
