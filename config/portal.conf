# ============================================================
# portal - web portal (FastAPI + SPA) default tunables.
#
# This file is TRACKED and ships with the repo (no secrets here).
# The session SECRET_KEY is injected from the git-ignored
# portal/.env (SECRET_KEY=...) via the portal service's env_file.
# Full option documentation lives in config/portal.conf.example.
# ============================================================

# Session cookie lifetime (days) and whether the cookie is Secure-only.
SESSION_DAYS=7
COOKIE_SECURE=false

# Live-view idle time watch: stop the stream after this many seconds of
# user inactivity (mouse/touch/keyboard resets the clock).
STREAM_IDLE_TIMEOUT_S=300

# Landing camera when the user has no per-user default_camera.
DEFAULT_CAMERA=cam01

FRIGATE_API=http://frigate:5000

# firewatch evidence: DB path + stored-jpg prefix remap.
FIREWATCH_DB=/media/firewatch.db
FIREWATCH_JPG_PREFIX=/media/firewatch/
FIREWATCH_JPG_REPLACE=/media/
