# ============================================================
# scenereader - cross-camera episode narrator tunables.
#
# Consumed by the `scenereader` Docker service (scenereader/scenereader.py,
# mounted at /scenereader/scenereader.py). Read-only mount at
# /config/scenereader.conf. NO secrets here.
#
# WHAT IT DOES (see plans/event-scene-reader.md): it does NOT re-detect anything.
# It reads the capture events Frigate already produced - the snapshot JPEGs in
# its own media tree (never copied) plus the matching row in Frigate's `event`
# table - and turns them into a story across cameras, e.g.
#
#   "Person A entered Field 1 (cam04) at 22:36, stayed 12 min; then went to
#    Store (cam07) at 22:49; left at 22:51."
#
# The per-capture sentence is DETERMINISTIC (no model). A small VLM additionally
# captions the frame, but ONLY during an idle-gated batch, so the host is never
# hammered the way the old 15 s sweep did.
#
# Every value can be overridden by a same-named environment variable on the
# service (docker-compose.yml `environment:`), which wins.
#
# Edit here and `docker compose restart scenereader` - NO image rebuild.
#
# NOTE: the KEY=VALUE parser treats everything after '=' as the value, so a
# comment must live on its OWN line (never after a value).
# ============================================================

# Master switch. false keeps the container alive but stops scanning/draining
# (pause the cost without a rebuild).
ENABLED=true

# Cameras to track, exact Frigate names (Frigate OWNS these identifiers).
# Used to report cameras that have no place mapping.
CAMERAS=cam01,cam02,cam03,cam04,cam05,cam06,cam07,cam08,cam09,cam10

# Liveness line every HEARTBEAT_S (the loop is otherwise silent between events).
HEARTBEAT_S=300

# ====================================================================
# FRIGATE ACCESS (read-only)
#
# FRIGATE_API          used only as a metadata FALLBACK (/api/events/<id>)
# FRIGATE_MEDIA_DIR    where Frigate's own media tree is visible; the compose
#                      mount maps the host ./media tree here, so Frigate's
#                      frames appear under <MEDIA_DIR>/clips
# FRIGATE_SNAPSHOT_DIRS  "clips" ONLY - verified 2026-09-10: there is no
#                      media/snapshots/ dir; clips/ holds
#                      <camera>-<event_id>.jpg plus a -clean.webp sibling
#                      (the un-annotated frame, which is the one we caption)
# FRIGATE_DB           Frigate's own SQLite; it opens READ-ONLY (mode=ro) while
#                      Frigate runs and has ONE denormalised `event` table. The
#                      snapshot filename carries the event id, so the join is
#                      EXACT. NOTE: score/top_score/box COLUMNS ARE NULL - the
#                      live values are inside the `data` JSON, which we parse.
# FRIGATE_METADATA_SOURCE  db (default) | api | auto  (auto = try db, then api)
# ====================================================================
FRIGATE_API=http://frigate:5000
FRIGATE_MEDIA_DIR=/media
FRIGATE_SNAPSHOT_DIRS=clips
FRIGATE_SNAPSHOT_GLOB=*.jpg
FRIGATE_DB=/config/frigate.db
FRIGATE_METADATA_SOURCE=db

# ====================================================================
# SCAN TIMING (cheap; no model involved)
#
# A scan lists clips/, upserts anything new by event id, enriches it from
# frigate.db and writes the deterministic sentence. RESCAN_OVERLAP_S re-reads a
# small window so an event whose file appeared after its neighbour is not missed
# (upsert makes the re-read free of duplicates).
# ====================================================================
SCAN_EVERY_S=60
SCAN_LIMIT=400
RESCAN_OVERLAP_S=300

# Provisional rows (metadata not yet available - e.g. Frigate was restarting) are
# retried, oldest-first, this many per pass.
RE_ENRICH_PER_RUN=50

# ====================================================================
# DRAIN (the ONLY expensive step: it runs the VLM)
#
# A batch runs only when the IDLE GOVERNOR is open, and is bounded by
# MAX_EVENTS_PER_RUN and MAX_RUN_SECONDS. Closed gate = nothing runs and the
# reason is logged, so the host is protected by construction.
# ====================================================================
DRAIN_EVERY_S=300

# Most frames captioned in one batch.
MAX_EVENTS_PER_RUN=8

# Hard wall-clock ceiling for one batch (the batch stops early past this).
MAX_RUN_SECONDS=240

# Caption only `person` events (the episode narrator cares about people; a
# vehicle-only caption is optional detail). false = caption every pending event.
ONLY_PERSON_CAPTIONS=false

# ====================================================================
# IDLE GOVERNOR - host protection
#
# Reads the host 1-minute load average (/proc/loadavg) and the hottest CPU
# temperature (/sys/class/hwmon coretemp). The batch is SKIPPED while either is
# over the MAX; RESUME_* documents the intended hysteresis. FORCE_ALLOW_HOT=true
# lets the portal's "Process now" bypass the temperature guard - leave false.
#
# The old scenewatch pinned 4 cores at a 15 s sweep and drove the box hot; this
# gate plus the batch bounds is the fix.
# ====================================================================
MAX_LOADAVG=3.0
RESUME_LOADAVG=1.5
MAX_CPU_TEMP_C=78
RESUME_CPU_TEMP_C=70
FORCE_ALLOW_HOT=false

# Where the host's /proc and hwmon are visible (compose mounts them read-only).
HOST_PROC=/proc
HOST_HWMON=/sys/class/hwmon

# ====================================================================
# STORE (TEXT ONLY - no image copies anywhere)
#
# <STORE_DIR>/events.db   WAL SQLite: events + episodes + visits + aliases
# <STORE_DIR>/reader_status.json   heartbeat the portal reads
# <STORE_DIR>/.drain_request       portal -> service "Process now" flag
# <STORE_DIR>/names.json           portal -> service assisted person names
#
# The heartbeat cleaner hard-protects *.db / *.db-wal / *.db-shm, so the store
# can never be deleted by the disk cron.
# ====================================================================
STORE_DIR=/media/events
STORE_DB=events.db
STORE_ENABLED=true

# Row retention (0 = keep everything). Row expiry is owned by the service
# (the DB file itself is never deleted).
EVENTS_RETENTION_DAYS=30

# ====================================================================
# CAPTIONER - MODEL_BACKEND chooses which model runs
#
#   llamacpp  DEFAULT: a small (<=500M) SmolVLM2 GGUF + mmproj served by a
#             RESIDENT llama-server child process. Start here - it is the
#             smallest useful model.
#   openvino  RETAINED: the Qwen2-VL-2B int4 OpenVINO IR ALREADY on this host in
#             models/scene/ (kept, never deleted, never re-downloaded). Flip this
#             one value to reassess the larger model - no code change.
#
# RESIDENCY: the model is loaded ONCE and kept (MODEL_KEEP_LOADED=true). For a
# small model, load/unload churn would burn CPU for no real RAM gain; the
# unload-after-idle path is a DEFERRED OPTIMIZATION - set
# MODEL_KEEP_LOADED=false and IDLE_UNLOAD_S>0 only if RAM becomes contended.
#
# The llama.cpp binaries are NOT baked into the image (no unverifiable release
# URL at build time). `dev_scripts/prep_scene_model_llamacpp.sh` fetches them
# onto the host into models/scene/bin/ (git-ignored) and the paths below point
# there.
# ====================================================================
MODEL_BACKEND=llamacpp
MODEL_KEEP_LOADED=true
IDLE_UNLOAD_S=0
MODEL_FILE=/models/scene/smolvlm2-500m/SmolVLM2-500M-Video-Instruct-Q8_0.gguf
MMPROJ_FILE=/models/scene/smolvlm2-500m/mmproj-SmolVLM2-500M-Video-Instruct-f16.gguf
LLAMA_SERVER_BIN=/models/scene/bin/llama-server
LLAMA_CLI_BIN=/models/scene/bin/llama-mtmd-cli

# Only used when MODEL_BACKEND=openvino (the retained 2B IR).
OPENVINO_DIR=/models/scene
OPENVINO_DEVICE=CPU
OPENVINO_THREADS=2

# Inference bounds. The iGPU belongs to Frigate's detector, so the captioner
# stays on CPU with a small thread budget.
VLM_N_THREADS=2
VLM_CTX=4096
VLM_MAX_TOKENS=64

# The prompt is GROUNDED: the deterministic facts are appended to it, so the
# model may only rephrase/add what is visible, never invent places or names.
VLM_PROMPT=Describe this CCTV frame in one short sentence. Use the given facts and add only what is plainly visible. Do not invent places, names or activity.

# ====================================================================
# EPISODES (L2 linking + L3 building + L4 narrative)
#
#   EPISODE_LABELS    which Frigate labels form a person episode
#   REID_MAX_GAP_S    how soon after leaving camera A a track may appear in an
#                     ADJACENT camera B and still be the same person. This is
#                     the cross-camera link window.
#   EPISODE_GAP_S     quiet time that ENDS an episode.
#   VISIT_MIN_S       drop episodes shorter than this (0 = keep all).
#   NARRATIVE_TZ_OFFSET_H  hours added to the UTC timestamps in the sentence
#                     (Asia/Riyadh = 3).
#
# Adjacency comes from config/places.conf (ADJACENCY=), NOT from here: it is farm
# geography, not a tunable.
# ====================================================================
EPISODE_LABELS=person
REID_MAX_GAP_S=90
EPISODE_GAP_S=600
VISIT_MIN_S=0
EPISODES_EVERY_S=300
NARRATIVE_TZ_OFFSET_H=3
