# ============================================================
# scenewatch - farm scene-description watchdog tunables.
#
# Consumed by the `scenewatch` Docker service (scenewatch/scenewatch.py,
# mounted at /scenewatch/scenewatch.py in the container), which reads this
# file read-only at /config/scenewatch.conf. No secrets here.
#
# What it does (see plans/scene-description.md): mirrors firewatch's
# batched two-frame motion sweep, and when a camera shows motion, runs a
# small SmolVLM vision-language model on that camera's current frame and
# stores a one-line scene description in a WAL SQLite DB.
#
# Every value can be overridden by a same-named environment variable on
# the scenewatch service (docker-compose.yml `environment:`), which wins.
#
# Edit on the host and restart the service to apply - no image rebuild:
#     docker compose restart scenewatch
#
# NOTE: KEY=VALUE parser treats everything after '=' as the value, so
# comments must live on their OWN line (never after a value).
# ============================================================

# Cameras to describe (comma-separated, exact Frigate camera names).
# Kept in step with config/firewatch.conf; add cam10 here if wanted.
CAMERAS=cam01,cam02,cam03,cam04,cam05,cam06,cam07,cam08,cam09

# Master switch. false keeps the container running but stops the sweep
# (handy to pause the CPU/RAM cost without a rebuild/scale).
ENABLED=true

# Liveness heartbeat: a healthy watcher logs nothing between captions, so
# every HEARTBEAT_S seconds it prints one summary line proving the sweep
# loop is alive (captions this window, skips, current RAM use).
HEARTBEAT_S=300

# Frigate API base URL (compose service name) + container paths.
FRIGATE_API=http://frigate:5000
MODEL_DIR=/models/scene

# ====================================================================
# MODEL / INFERENCE
#
# SmolVLM2 INT4 OpenVINO IR (see models/scene/README.md). The model is
# loaded ONCE at process start and stays resident in RAM for the life of
# the container - it is never reloaded per caption.
#
# MODEL_DEVICE=CPU keeps the iGPU entirely for Frigate's OpenVINO detector
# (the detector already saturates it). Switch to GPU only after measuring
# the detector's inference_speed under the extra load.
#
# INFERENCE_NUM_THREADS bounds the CPU the captioner may take, so Frigate
# decode/detect is not starved. The host has 8 cores; keep this well below
# 8 (4 = half).
# ====================================================================
MODEL_DEVICE=CPU
INFERENCE_NUM_THREADS=4

# Prompt + length cap for the caption. One short sentence keeps the token
# budget (and therefore the per-caption latency) small and bounded.
CAPTION_PROMPT=Describe this CCTV scene in one short sentence. Mention people, vehicles, animals or notable activity. If nothing is happening, say so.
CAPTION_MAX_NEW_TOKENS=48

# ====================================================================
# SWEEP + MOTION GATE (mirrors firewatch, see config/firewatch.conf)
#
# A batched two-frame sweep covers all cameras every POLL_INTERVAL_S:
# fetch frame A for every camera, sleep MOTION_GAP_S (> 1 s), fetch frame
# B, then diff A/B per camera. The model runs ONLY on cameras whose motion
# gate passed (or whose periodic baseline is due).
# ====================================================================

# Seconds between sweep starts.
POLL_INTERVAL_S=15

# Seconds between the two motion frames of a sweep (A then B). MUST stay
# > 1 s so real movement registers between the frames.
MOTION_GAP_S=1.5

# Short latest.jpg timeout so a sweep stays tight.
MOTION_FETCH_TIMEOUT_S=1.0

# Accept a camera's motion diff only when its A->B gap is within [min, max]
# (skip the camera otherwise).
MOTION_GAP_MIN_S=0.5
MOTION_GAP_MAX_S=5.0

# Gaussian blur kernel before diffing.
MOTION_DENOISE_KERNEL=3

# |grayA - grayB| above this = a pixel changed (day).
MOTION_PIXEL_DIFF=18

# Frame mean luma below this = night (ISO/IR noise is higher at night).
MOTION_NIGHT_LUMA=25

# Night pixel-diff (used when the mean luma < MOTION_NIGHT_LUMA).
MOTION_PIXEL_DIFF_NIGHT=26

# Minimum changed-pixel fraction to pass the motion gate.
MOTION_FRAME_FRAC=0.0015

# Above this changed fraction = a GLOBAL change (auto-exposure / white-balance
# / camera shake), which is NOT usable motion.
MOTION_FRAME_FRAC_MAX=0.20

# ====================================================================
# CAPTION SCHEDULING
# ====================================================================

# Describe a camera even without motion this often - a still scene (a parked
# vehicle, a person standing) still deserves an occasional caption. Captions
# are far more expensive than firewatch's classifier, so this is minutes,
# not firewatch's 120 s.
BASELINE_EVERY_S=600

# Per-camera quiet period after a caption. Without this a slow-moving object
# would be re-described on every 15 s sweep - wasted CPU and duplicate rows.
CAPTION_COOLDOWN_S=120

# ====================================================================
# SCENE STORE (WAL SQLite; descriptions are tiny text rows)
#
#   STORE_DIR            writable dir inside the container. compose mounts
#                        the git-ignored host ./media at /media, so
#                        /media/scenewatch lands in host ./media/scenewatch/
#                        (its own subdir - never mixed with Frigate media).
#   STORE_DB             DB filename inside STORE_DIR (WAL mode).
#   STORE_IMAGES         false (default) = store only the description text.
#                        true = ALSO keep the captioned JPEG next to the DB.
#                        Kept off by default: discrete labelled JPEGs are
#                        valuable fire evidence, but every-moving-frame
#                        snapshots would churn disk for little gain. The
#                        unified heartbeat caps this store either way.
#   STORE_RETENTION_DAYS  0 = keep everything. >0 prunes scene rows older
#                        than N days (opportunistically ~once a minute).
#   STORE_ENABLED        master switch; false = caption to stdout only.
# ====================================================================
STORE_DIR=/media/scenewatch
STORE_DB=scenewatch.db
STORE_IMAGES=false
STORE_RETENTION_DAYS=30
STORE_ENABLED=true
