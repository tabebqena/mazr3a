# ============================================================
# Store profile: firewatch evidence store (DB-aware, delegated).
# Used by: scripts/heartbeat_cleanup.py (host, root cron).
#
# firewatch evidence = <cam>/*.jpg + firewatch.db, all living at the TOP
# of the host {DEPLOY}/media tree (compose mounts ./media into BOTH
# /media/frigate and /media/firewatch). It is NOT safe to glob-sweep it:
# firewatch's SQLite DB is the source of truth for which JPEGs exist.
#
# So this profile is TYPE=docker-exec: the heartbeat delegates to the
# existing in-container worker scripts/cleanup_firewatch_store.py, which
# uses the DB and removes only DB-referenced files (never Frigate media).
# The worker reads its own tunables (config/cleanup_firewatch.conf
# mounted at /config) -> MAX_IMAGES_GB (2 GiB default) + ROW_EXPIRE_DAYS
# (90). Runs as the firewatch user (uid 1000), owner of the evidence.
# ============================================================

ENABLED=1
TYPE=docker-exec
NAME=firewatch

# Command the heartbeat runs (no shell: split on whitespace; the worker
# handles its own logging). Use the container name from docker-compose.
EXEC_CMD=docker exec firewatch python /scripts/cleanup_firewatch_store.py

# Flag appended in --dry-run so the worker also only reports.
EXEC_DRY_FLAG=--dry-run

# Optional constant args appended on EVERY real invocation (e.g. lower the
# image cap during a disk emergency: --max-images-gb 1). Leave empty.
EXEC_ARGS=

# Phase-2 escalation priority (higher = freed LAST - evidence is valuable,
# and the worker can only free what its own caps allow anyway).
PRIORITY=50

# Informational host-side view of the store cap (not enforced here; the
# in-container worker owns the real cap). Used only for the --check table.
MAX_SIZE_GB=2
MAX_AGE_DAYS=90
