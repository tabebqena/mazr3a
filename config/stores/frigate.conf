# ============================================================
# Store profile: Frigate media (recordings / clips / snapshots /
# cache / exports).
# Used by: scripts/heartbeat_cleanup.py (host, root cron).
#
# Frigate writes this tree as ROOT inside the frigate container. On the
# host it is {DEPLOY}/media (the compose mount ./media:/media/frigate).
# NOTE: the SAME host ./media tree also holds firewatch evidence (<cam>/
# dirs + firewatch.db at the TOP level) and the watchdog CSV subdir -
# so this profile manages ONLY Frigate's own subdirs below, never the
# whole media root. Verify the exact host subdir names at deploy
# (plans/disk-heartbeat-cleanup.md).
#
# Deleting needs write on the parent dirs; the heartbeat runs as root.
# ============================================================

ENABLED=1
TYPE=dir
NAME=frigate

# Managed directories: <ROOT>/<SUBDIRS entry>. SUBDIRS empty = ROOT itself.
ROOT={DEPLOY}/media
SUBDIRS=recordings,clips,snapshots,cache,exports

# Max recursion depth from each managed dir. Empty/unset = unlimited.
DEPTH=

# FILE_PATTERNS (optional, comma globs on basename): when set, ONLY files
# matching are deletion candidates (whitelist). Empty = all files eligible
# (minus EXCLUDE_GLOB + built-in hard protects).
FILE_PATTERNS=

# Basenames NEVER deleted (on top of built-in hard protects
# *.db, *.db-wal, *.db-shm, *.lock, *.pid, *.sock, *.state).
EXCLUDE_GLOB=

# Phase-1 compliance (runs EVERY tick): 0 disables that rule.
# MAX_AGE_DAYS - delete files older than N days (always-on belt).
# MAX_SIZE_GB  - delete oldest-first while the store is over the cap.
# Both 0 = this store only participates in the global-cap escalation.
MAX_AGE_DAYS=0
MAX_SIZE_GB=20

# Phase-2 escalation order (lower freed first when the disk hits the
# global cap). Frigate media is the biggest + lowest-value -> freed first.
PRIORITY=10
