# ============================================================
# Store profile: host deploy-root runtime logs + state.
# Used by: scripts/heartbeat_cleanup.py (host, root cron).
#
# Several host scripts append logs / state AT the deploy root, e.g.
#   {DEPLOY}/media-cleanup.log      (legacy cleanup, superseded)
#   {DEPLOY}/heartbeat-cleanup.log  (this heartbeat's own log)
#   {DEPLOY}/machine-monitor.state  (temp watchdog state - tiny, HARD-
#                                    protected: *.state, never deleted)
#
# This profile ages out only top-level *.log files older than
# MAX_AGE_DAYS. DEPTH=0 keeps it to the deploy ROOT itself - it never
# descends into scripts/, config/, media/, mosquitto/ etc., so tracked
# code/config and other stores are untouchable.
# ============================================================

ENABLED=1
TYPE=dir
NAME=logs

ROOT={DEPLOY}
SUBDIRS=
DEPTH=0
FILE_PATTERNS=*.log
EXCLUDE_GLOB=

MAX_AGE_DAYS=30
MAX_SIZE_GB=0

# Escalation priority: old text logs are the least valuable -> freed first
# (lowest number). Below frigate(10) / watchdog(20) / mosquitto(30) /
# firewatch(50), so the heartbeat trims logs before touching recordings.
PRIORITY=5
