# ============================================================
# Store profile: Mosquitto MQTT broker runtime data + logs.
# Used by: scripts/heartbeat_cleanup.py (host, root cron).
#
# Mosquitto persists its message DB under {DEPLOY}/mosquitto/data and
# (by default) logs to stdout; the compose mounts
# ./mosquitto/data and ./mosquitto/log. The DB itself is HARD-PROTECTED
# (built-in *.db etc.), so only true log/persistence junk older than
# MAX_AGE_DAYS is removed.
# ============================================================

ENABLED=1
TYPE=dir
NAME=mosquitto

ROOT={DEPLOY}/mosquitto
SUBDIRS=data,log
DEPTH=

FILE_PATTERNS=
EXCLUDE_GLOB=

MAX_AGE_DAYS=7
MAX_SIZE_GB=0

# Escalation priority: small broker logs -> after watchdog, before fire.
PRIORITY=30
