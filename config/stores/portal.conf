# ============================================================
# Store profile: portal-owned data (per-user bandwidth usage DB).
# Used by: scripts/heartbeat_cleanup.py (host, root cron).
#
# The portal is normally a READ-ONLY consumer of the other stores
# (firewatch.db / events.db use PRAGMA query_only). This is the ONE
# thing it writes: media/portal/usage.db, the daily per-user egress
# counters that back the footer self-view + the admin Usage tab.
#
# RETENTION IS IN-APP, NOT HERE: heartbeat_cleanup.py hard-protects
# *.db / *.db-wal / *.db-shm, so it can never delete or prune this DB.
# portal/usage.py prunes rows older than USAGE_RETENTION_DAYS (default
# 180) itself. This profile exists so the store is INVENTORIED and can
# participate in the global-cap escalation; with the DB protected there
# is normally nothing for it to free.
#
# See plans/portal-bandwidth-usage.md and portal/usage.py.
# ============================================================

ENABLED=1
TYPE=dir
NAME=portal-usage

# Managed dir: <ROOT>/<SUBDIRS entry>. The portal creates
# media/portal/ on demand (PORTAL_USAGE_DB=/media/portal/usage.db).
ROOT={DEPLOY}/media
SUBDIRS=portal

# Max recursion depth from the managed dir. Empty/unset = unlimited.
DEPTH=

# No file patterns: every candidate is eligible in principle, but the
# hard-protect list keeps the SQLite DB (and its -wal/-shm) safe.
FILE_PATTERNS=
EXCLUDE_GLOB=

# Phase-1 compliance (runs EVERY tick): 0 disables that rule. The DB is
# hard-protected, so both are 0 - row retention is handled in-app by the
# portal (USAGE_RETENTION_DAYS).
MAX_AGE_DAYS=0
MAX_SIZE_GB=0

# Phase-2 escalation order (lower freed first). Lowest value: this store
# holds only the protected usage DB, so it should be the LAST thing the
# global-cap escalation touches.
PRIORITY=90
