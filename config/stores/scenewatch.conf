# ============================================================
# Store profile: scenewatch scene store (<cam>/*.jpg + scenewatch.db).
# Used by: scripts/heartbeat_cleanup.py (host, root cron).
#
# scenewatch lives in its OWN subdir of the shared host media tree
# ({DEPLOY}/media/scenewatch), so this profile is scoped to that dir and
# can never touch Frigate recordings or firewatch evidence.
#
# SAFETY: the scene DB is the source of truth for the descriptions, and
# heartbeat_cleanup hard-protects *.db / *.db-wal / *.db-shm regardless of
# FILE_PATTERNS (see _HARD_PROTECT in scripts/heartbeat_cleanup.py). This
# profile therefore only ages out the OPTIONAL captioned JPEGs
# (STORE_IMAGES=true in config/scenewatch.conf) - with STORE_IMAGES=false
# there is nothing here to delete and this profile is a no-op.
#
# Row expiry (STORE_RETENTION_DAYS) is owned by the service itself, not by
# this heartbeat: the worker deletes old ROWS, the DB file stays.
# ============================================================

ENABLED=1
TYPE=dir
NAME=scenewatch

ROOT={DEPLOY}/media/scenewatch
SUBDIRS=
DEPTH=

# Only the optional captioned JPEGs (one dir per camera). Never *.db*.
FILE_PATTERNS=*.jpg
EXCLUDE_GLOB=

MAX_AGE_DAYS=30

# Same evidence-weight cap as firewatch's store (config/stores/firewatch.conf).
MAX_SIZE_GB=2

# Escalation priority: below firewatch's evidence (50) - a scene caption is
# less critical than a confirmed fire frame - but above machine logs (5/20)
# and mosquitto (30).
PRIORITY=45
