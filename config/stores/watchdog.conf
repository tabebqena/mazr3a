# ============================================================
# Store profile: watchdog baseline CSVs (scripts/watchdog_baseline.py
# cron recorder, one row per minute into a size-capped CSV per tag).
# Used by: scripts/heartbeat_cleanup.py (host, root cron).
#
# Files land in {DEPLOY}/media/watchdog/watchdog_baseline_<tag>.csv
# (+ a .stat CPU sidecar + a .lock while a tick is running). The CSV is
# already row-capped by the recorder (--max-rows); this profile adds an
# AGE safety net so old experiment tags don't accumulate forever.
# ============================================================

ENABLED=1
TYPE=dir
NAME=watchdog

ROOT={DEPLOY}/media/watchdog
SUBDIRS=
DEPTH=

FILE_PATTERNS=*.csv
# Never delete the live .lock / CPU sidecar .stat / anything else.
EXCLUDE_GLOB=*.lock,*.stat

MAX_AGE_DAYS=14
MAX_SIZE_GB=0

# Escalation: low-value machine logs -> freed before fire evidence.
PRIORITY=20
