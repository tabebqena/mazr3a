# ============================================================
# visits - per-camera person-visit log tunables.
#
# Consumed by the `visits` Docker service (visits/visits.py, mounted at
# /visits/visits.py). Read-only mount at /config/visits.conf. NO secrets here.
#
# WHAT IT DOES (see plans/visit-log.md): it does NOT re-detect and uses NO
# model/VLM. It reads Frigate's person events through the REST API only
# (/api/events - NEVER the Frigate SQLite DB), crops each person from the
# mounted media tree (<cam>-<event_id>-clean.webp), and writes ONE text line per
# visit, per camera:
#
#   Estraha (cam01)  Field West  person #2  14:32-14:36  4 min
#
# Every value can be overridden by a same-named environment variable on the
# service (docker-compose.yml `environment:`), which wins.
#
# Edit here and `docker compose restart visits` - NO image rebuild.
#
# NOTE: the KEY=VALUE parser treats everything after '=' as the value, so a
# comment must live on its OWN line (never after a value).
# ============================================================

# Master switch. false keeps the container alive but stops polling/analysis.
ENABLED=true

# ====================================================================
# FRIGATE ACCESS (REST only)
# ====================================================================
FRIGATE_API=http://frigate:5000
# Host media tree, mounted at this path; Frigate's clips live in <dir>/clips.
FRIGATE_MEDIA_DIR=/media
CLIPS_SUBDIR=clips

# ====================================================================
# STORE (TEXT ONLY - no image copies)
#
# <STORE_DIR>/visits.db   WAL SQLite: cached events + derived visits
# <STORE_DIR>/.cursor     last processed start_time (REST pagination cursor)
# ====================================================================
STORE_DIR=/media/visits
STORE_DB=visits.db
PLACES_CONF=/config/places.conf

# ====================================================================
# POLLING
# ====================================================================
POLL_EVERY_S=60
HEARTBEAT_S=300
# First run backfills this far back (seconds). 604800 = 7 days.
INITIAL_LOOKBACK_S=604800
# Re-read this window before the cursor each poll so an event whose end_time
# was still open is updated (upsert by id makes the re-read free of duplicates).
RESCAN_OVERLAP_S=300
# REST page size (pagination is automatic).
FETCH_LIMIT=1000
ONLY_PERSON=true

# ====================================================================
# MERGE + IDENTITY (per camera)
#
# A new event joins an OPEN PRESENCE when the gap is <= MERGE_GAP_S AND the
# motion direction is within ANGLE_TOL_DEG AND the clothing histogram matches
# (>= HIST_THRESHOLD). Otherwise it starts a NEW person #.
# A presence is RETIRED after INACTIVITY_S with no person events.
# ====================================================================
MERGE_GAP_S=30
# 14400 s = 4 h: the overnight gap (people leave, return ~07:00) closes every
# presence, so each morning starts a fresh person #.
INACTIVITY_S=14400
ANGLE_TOL_DEG=45
# Clothing-histogram cosine similarity required to treat two events as the same
# person. Similarity values are logged so this can be tuned on real data.
HIST_THRESHOLD=0.6

# ====================================================================
# SIGNIFICANCE / LOAD REDUCTION
#
# "Significant" is decided from METADATA ONLY: the object's own trajectory span
# (motion_disp) and whether the box touches a frame edge. Significant events are
# cropped/histogrammed immediately. INSIGNIFICANT events (e.g. someone moving a
# hand while standing) are buffered and NOT cropped until
# INSIGNIFICANT_COUNT_THRESHOLD of them have accumulated for a camera, then the
# batch is analysed once. Visits whose whole presence never moved and never
# touched an edge are stored with significant=0 and left out of the text log.
# ====================================================================
MOTION_MIN_DISP=0.05
EDGE_MARGIN=0.05
INSIGNIFICANT_COUNT_THRESHOLD=5
# Ignore visits shorter than this (seconds).
MIN_DURATION_S=8
# Crop shorter than this many pixels on either side => histogram unusable
# (falls back to gap+direction merge).
MIN_CROP_PX=16

# ====================================================================
# RETENTION / DISPLAY
# ====================================================================
VISITS_RETENTION_DAYS=7
# Display timezone offset (hours from UTC) for the visit clock.
TZ_OFFSET_H=0
