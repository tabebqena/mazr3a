# ============================================================
# Frigate NVR + Mosquitto MQTT broker - Phase 0 baseline
# Target: Debian host, CPU-only (OpenVINO detector)
#
# RESOURCE LIMITS (host = 8 cores, ~7.5 GiB RAM)
# ------------------------------------------------------------
# `cpus` is a HARD CFS quota and `mem_limit` a HARD memory ceiling
# (equivalent to docker run --cpus / --memory). Neither reserves anything:
# a limit is only a maximum, so a container using less is unaffected.
#
# Why memory limits matter here: without one, a runaway container can exhaust
# the host and the kernel's OOM killer picks a victim by score - which may be
# Frigate. A per-container ceiling makes the cgroup that OVERSHOOTS die first.
# `oom_score_adj` states the preference explicitly (lower = killed later):
#   frigate      -500  the NVR is the critical path; never kill it first
#   scenereader   200  the newest consumer; kill it first
#
# NOTE: the ceilings deliberately SUM to more than the host's RAM (~8.25 GiB).
# They are backstops against runaway growth, not a hard partition of memory -
# a strict partition would have to be tight enough to OOM-kill Frigate during
# a recording burst, which is the one failure mode worth avoiding. To make it a
# hard partition instead, lower each value so the total fits under ~6.5 GiB.
#
# Frigate's cgroup also contains its 1 GB tmpfs /tmp/cache AND its 256 MB
# /dev/shm (tmpfs/shmem are charged to the memory cgroup), so its floor is
# ~1.25 GB before any ffmpeg/python working set - hence its generous ceiling.
#
# Frigate is deliberately NOT CPU-capped: CFS throttling can make it drop
# decoded frames (exactly what the detector-health checks look for). Instead
# every OTHER service is capped, and those caps sum to ~7.4 of the 8 cores, so
# Frigate always has headroom.
# ============================================================

services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    stop_grace_period: 30s
    # Resource ceiling (see the header). ~1.5-2 GB typical; the ceiling covers
    # the 1 GB tmpfs cache + 256 MB shm + ffmpeg working set. Raise this first
    # if Frigate ever logs OOM / gets killed during a recording burst.
    mem_limit: 3g
    # Last container the kernel should OOM-kill (lower = killed later).
    oom_score_adj: -500
    # Shared memory (/dev/shm) used by FFmpeg decode buffers.
    # Frigate recommends >=254MB for 10 cameras with hardware decode
    # (it logged "SHM size too small" at 128mb).
    shm_size: "256mb"
    # Pass camera credentials from .env into the container. Frigate 0.17
    # reads them via {FRIGATE_...} placeholders in config/config.yaml
    # (str.format() on FRIGATE_-prefixed vars; the old !env_var YAML tag
    # is NOT supported and would be left literal in the URL). Keep the
    # variable names in .env prefixed with FRIGATE_, e.g.:
    #   FRIGATE_RTSP_USER / FRIGATE_RTSP_PASS  (see .env.example)
    env_file:
      - .env
    ports:
      - "5000:5000"   # Frigate Web UI (HTTP)
      - "8971:8971"   # Frigate Web UI (TLS, self-signed)
      - "8554:8554"   # RTSP restream
      - "8555:8555/tcp" # WebRTC
      - "8555:8555/udp" # WebRTC
    volumes:
      - ./config:/config
      - ./media:/media/frigate
      # Detector model (COCO ONNX under models/coco/) - read-only. config.yaml
      # model.path/labelmap_path + detector model_path point at /models/coco/.
      - ./models:/models:ro
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000 # 1GB tmpfs cache for recordings/snapshots in RAM
    # Intel Quick Sync Video hardware decode (i7-9700 iGPU / UHD 630).
    # Enabled because /dev/dri/renderD128 is present on the host.
    # If VAAPI decode fails, remove this device and drop
    # hwaccel_args from config/frigate.yml to fall back to software decode.
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128

  mqtt:
    container_name: mqtt
    image: eclipse-mosquitto:2
    restart: unless-stopped
    cpus: "0.5"          # tiny broker; never a bottleneck
    mem_limit: 256m
    ports:
      - "1883:1883" # MQTT broker (Frigate publishes events here)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  # ------------------------------------------------------------------
  # firewatch - farm fire/smoke watchdog (see plans/fire-detection.md).
  # Out-of-band: does NOT touch Frigate's person/car/animal detection.
  # Polls each camera's already-decoded detect frame via the Frigate REST
  # API (/api/<cam>/latest.jpg) and alerts on Telegram with a snapshot.
  # Dependency-only image (./firewatch); code/config/model are mounted
  # read-only so edits need only `docker compose restart firewatch`.
  # firewatch.py lives in ./firewatch (mounted at /firewatch); the shared
  # helper telegram_notify.py stays in ./scripts (mounted at /scripts). The
  # fire/smoke OpenVINO IR model must exist at ./models/fire/ (see
  # models/fire/README.md); the Telegram bot lives in config/telegram.conf
  # (git-ignored). First build needs network for pip.
  # ------------------------------------------------------------------
  firewatch:
    container_name: firewatch
    build: ./firewatch
    restart: unless-stopped
    cpus: "2.0"          # small IR model at a low cadence
    mem_limit: 1g        # ~0.35-0.5 GB typical (python + OpenVINO + YOLO IR)
    volumes:
      - ./firewatch:/firewatch:ro
      - ./scripts:/scripts:ro
      - ./config:/config:ro
      - ./models:/models:ro
      # Evidence store: firewatch persists every fire-marked frame as a JPEG
      # under the git-ignored ./media dir, mounted read-write at
      # /media/firewatch (subdir firewatch/), and records its metadata
      # (detections, scores, image path) in a WAL-mode SQLite DB (firewatch.db)
      # in the same dir. Same host media tree Frigate records into - no new
      # host dir. See plans/firewatch-sqlite-evidence-store.md.
      - ./media:/media/firewatch
    environment:
      - FRIGATE_API=http://frigate:5000   # compose network: frigate service
      - TELEGRAM_CONF=/config/telegram.conf
      - FIREWATCH_CONF=/config/firewatch.conf
      - MODEL_DIR=/models/fire
      - STORE_DIR=/media/firewatch
    depends_on:
      - frigate

  # ------------------------------------------------------------------
  # scenereader - cross-camera episode narrator (see plans/event-scene-reader.md).
  # REPLACES the stopped scenewatch (plans/scene-description.md), which
  # over-subscribed the CPU with a 15 s per-camera sweep and held a 2B VLM in RAM.
  #
  # It does NOT re-detect and does NOT sweep frames. Frigate already detected, so
  # this service only reads what Frigate produced:
  #   * the snapshot JPEGs/WebPs in Frigate's OWN media tree - read IN PLACE and
  #     never copied (host ./media IS Frigate's /media/frigate);
  #   * the matching `event` row in ./config/frigate.db, joined by the EXACT
  #     event id carried in the snapshot filename, opened READ-ONLY.
  # From those it writes a per-camera sentence and links cameras into person
  # episodes ("Person A entered Field 1 (cam04) at 22:36; then went to Store").
  #
  # COST: a tiny periodic disk scan, plus a small (<=500M GGUF) VLM caption batch
  # that runs ONLY when the idle governor (host loadavg + CPU temp) is open and is
  # bounded by MAX_EVENTS_PER_RUN/MAX_RUN_SECONDS. The model is loaded ONCE and
  # kept resident (MODEL_KEEP_LOADED=true) - for a small model, reload churn would
  # cost CPU for no real RAM gain.
  #
  # MODEL SWITCHING: the previously-downloaded Qwen2-VL-2B OpenVINO IR stays in
  # ./models/scene (git-ignored, KEPT - never deleted/re-downloaded) and is
  # selected with MODEL_BACKEND=openvino, no re-download and no rebuild. The small
  # GGUF + llama.cpp binaries are fetched by
  # dev_scripts/prep_scene_model_llamacpp.sh.
  #
  # Code/config are mounted read-only so edits need only
  # `docker compose restart scenereader`. It writes ONLY its text store under
  # ./media/events (plus the portal's trigger/status/names files).
  # NOTE: no /proc or /sys bind mount is needed. The container's own /proc/loadavg
  # is host-wide, and its NATIVE read-only /sys/class/hwmon exposes coretemp -
  # bind-mounting host /sys breaks hwmon's relative symlinks (see
  # plans/telegram-bot-cpu-temp-n-a.md).
  # ------------------------------------------------------------------
  scenereader:
    container_name: scenereader
    build: ./scenereader
    restart: unless-stopped
    # 1 of 8 cores: a periodic disk scan plus a short, bounded caption batch -
    # not a continuous sweep. Raise only if the drain is starved, never to 4.
    cpus: "1.0"
    # A CEILING, not a reservation: the small default model uses ~0.5-0.7 GB, so
    # this costs nothing in normal operation - but 3g leaves room to switch to the
    # RETAINED 2B OpenVINO backend (config/scenereader.conf MODEL_BACKEND=openvino,
    # ~2 GB resident) without also having to edit compose. `oom_score_adj: 200`
    # below still makes this the FIRST victim under real memory pressure, so the
    # wider ceiling does not put Frigate at risk.
    mem_limit: 3g
    # Prefer this container over Frigate when memory really runs out (below
    # Frigate's -500; the sidecar/portal defaults of 0 are between them).
    oom_score_adj: 200
    volumes:
      - ./scenereader:/scenereader:ro   # scenereader.py + its modules
      - ./config:/config:ro             # scenereader.conf, places.conf, frigate.db
      - ./models:/models:ro             # small GGUF, llama.cpp bin, retained 2B IR
      # Frigate's frames are read IN PLACE from this tree, and the TEXT store
      # lives in its own subdir so it never mixes with Frigate media:
      #   /media/events/{events.db,reader_status.json,.drain_request,names.json}
      # rw is required for the SQLite WAL files and the portal's trigger file.
      - ./media:/media
    environment:
      - SCENEREADER_CONF=/config/scenereader.conf
      - PLACES_CONF=/config/places.conf
      - FRIGATE_API=http://frigate:5000   # compose network: frigate service
      - FRIGATE_DB=/config/frigate.db
      - FRIGATE_MEDIA_DIR=/media
      - STORE_DIR=/media/events
    depends_on:
      - frigate

  # ------------------------------------------------------------------
  # telegram-bot - on-demand command responder for the farm Telegram bot
  # (see plans/telegram-command-bot.md). Long-polls the Bot API getUpdates
  # and answers /status, /help, /start IN THE CHAT THAT ASKED.
  # Dependency-free: a stock python:3.11-slim image (stdlib only) - no build.
  # Code + config are mounted read-only (like firewatch) so edits need only
  # `docker compose restart telegram-bot`. HOST health for /status comes from
  # read-only bind mounts (/proc, ./media) + ./config for the root filesystem
  # stats + the container's NATIVE read-only sysfs coretemp (HOST_HWMON=/sys/
  # class/hwmon). Do NOT bind-mount host /sys/class/hwmon for this: its relative
  # hwmon symlinks resolve outside the mount, so temps would read as n/a (see
  # plans/telegram-bot-cpu-temp-n-a.md) + the Frigate REST API; the container
  # never writes to the host. Long-polling getUpdates must be the ONLY consumer
  # of the bot's updates (cron scripts + firewatch only SEND - no webhook).
  # ------------------------------------------------------------------
  telegram-bot:
    container_name: telegram-bot
    image: python:3.11-slim
    restart: unless-stopped
    cpus: "0.5"          # idle long-poll; bursts only on a command
    mem_limit: 256m
    command: ["python", "/scripts/telegram_bot.py"]
    volumes:
      - ./scripts:/scripts:ro            # telegram_bot.py + telegram_notify.py
      - ./config:/config:ro              # telegram.conf (creds + tunables)
      - /proc:/host/proc:ro              # host uptime / loadavg / meminfo / hostname
      - ./media:/media:ro                # Frigate media filesystem usage
    environment:
      - FRIGATE_API=http://frigate:5000  # compose network: frigate service
      - TELEGRAM_CONF=/config/telegram.conf
      - HOST_PROC=/host/proc
      - HOST_HWMON=/sys/class/hwmon       # native ro sysfs coretemp (see comment above)
      - MEDIA_DIR=/media
      - ROOT_STAT=/config                # config mount sits on the host root fs
    depends_on:
      - frigate

  # ------------------------------------------------------------------
  # logs - READ-ONLY Docker-logs sidecar for the portal's admin Debug tab
  # (see plans/portal-admin-debug-logs.md). It "stands idle": a tiny stdlib
  # HTTP server (scripts/container_logs.py) that owns a mount of the host
  # Docker socket (/var/run/docker.sock) and exposes ONLY a container list +
  # per-container log tail over the internal compose network (NO published
  # host ports). The portal calls it on demand when the admin opens the Debug
  # tab - the sidecar never polls. It runs as root (stock image default, like
  # telegram-bot) so it can open the root-owned socket, and issues Docker READ
  # calls only; it never exposes the raw socket.
  # ------------------------------------------------------------------
  logs:
    container_name: logs
    image: python:3.11-slim
    restart: unless-stopped
    cpus: "0.5"          # stands idle; serves on demand
    mem_limit: 256m
    command: ["python", "/scripts/container_logs.py"]
    volumes:
      - ./scripts:/scripts:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - LOGS_PORT=8090

  # ------------------------------------------------------------------
  # portal - authenticated web portal (FastAPI + vanilla JS SPA) that
  # proxies Frigate REST/events/media and serves Firewatch fire evidence
  # (login, single-camera live view with an idle time watch, events &
  # detections, fire alerts). See plans/portal-web-app.md (local only).
  #
  # PUBLIC ACCESS: the whole host sits behind a Cloudflare Tunnel with an
  # Access policy on live.mazr3a.garden; the tunnel maps the portal root ->
  # host:8080 (this service) under that Access policy, and the portal login
  # gates the dashboard/JSON API on top.
  #
  # LIVE VIEW = HLS primary (go2rtc 1.9.10 here has no MSE), proxied SAME-ORIGIN
  # through the portal (/api/live/<cam>/hls/stream.m3u8 -> Frigate go2rtc HLS via
  # /api/go2rtc/*), played with hls.js (vendored in portal/static/vendor), with a
  # detect-snapshot fallback (/api/live/<cam>/latest.jpg, ~1 fps). go2rtc pulls a
  # camera only while a viewer is connected; single active camera + an idle time
  # watch stop the stream when idle, releasing the pull.
  #
  # Dependency-only image (./portal carries deps; python:3.11-slim +
  # fastapi/uvicorn/httpx). Code + config are mounted read-only so edits
  # need only `docker compose restart portal`. ./media is mounted rw
  # because SQLite WAL readers need -shm/-wal write access to read the
  # firewatch evidence DB (the portal never writes - PRAGMA query_only).
  # First build needs network for pip.
  # ------------------------------------------------------------------
  portal:
    container_name: portal
    build: ./portal
    restart: unless-stopped
    cpus: "1.0"          # HTTP + proxying; HLS is streamed, not transcoded
    mem_limit: 512m      # ~0.15-0.25 GB typical
    ports:
      - "8080:8080"         # internal host port for the Cloudflare Tunnel
    volumes:
      - ./portal:/srv/app/portal:ro    # portal package + static SPA
      - ./config:/config:ro            # portal.conf (users + secret; git-ignored)
      - ./media:/media                 # firewatch evidence (rw for WAL read access)
    environment:
      - PORTAL_CONF=/config/portal.conf
      - PORTAL_LOGS_API=http://logs:8090   # read-only logs sidecar (Debug tab)
    depends_on:
      - frigate
      - logs
