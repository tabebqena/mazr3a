# ============================================================
# Frigate NVR + Mosquitto MQTT broker - Phase 0 baseline
# Target: Debian host, CPU-only (OpenVINO detector)
# ============================================================

services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    stop_grace_period: 30s
    # Shared memory (/dev/shm) used by FFmpeg decode buffers.
    # Frigate recommends >=254MB for 10 cameras with hardware decode
    # (it logged "SHM size too small" at 128mb).
    shm_size: "256mb"
    # Pass camera credentials from .env into the container. Frigate 0.17
    # reads them via {FRIGATE_...} placeholders in config/config.yaml
    # (str.format() on FRIGATE_-prefixed vars; the old !env_var YAML tag
    # is NOT supported and would be left literal in the URL). Keep the
    # variable names in .env prefixed with FRIGATE_, e.g.:
    #   FRIGATE_RTSP_USER / FRIGATE_RTSP_PASS  (see .env.example)
    env_file:
      - .env
    ports:
      - "5000:5000"   # Frigate Web UI (HTTP)
      - "8971:8971"   # Frigate Web UI (TLS, self-signed)
      - "8554:8554"   # RTSP restream
      - "8555:8555/tcp" # WebRTC
      - "8555:8555/udp" # WebRTC
    volumes:
      - ./config:/config
      - ./media:/media/frigate
      # Detector model (COCO ONNX under models/coco/) - read-only. config.yaml
      # model.path/labelmap_path + detector model_path point at /models/coco/.
      - ./models:/models:ro
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000 # 1GB tmpfs cache for recordings/snapshots in RAM
    # Intel Quick Sync Video hardware decode (i7-9700 iGPU / UHD 630).
    # Enabled because /dev/dri/renderD128 is present on the host.
    # If VAAPI decode fails, remove this device and drop
    # hwaccel_args from config/frigate.yml to fall back to software decode.
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128

  mqtt:
    container_name: mqtt
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883" # MQTT broker (Frigate publishes events here)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  # ------------------------------------------------------------------
  # firewatch - farm fire/smoke watchdog (see plans/fire-detection.md).
  # Out-of-band: does NOT touch Frigate's person/car/animal detection.
  # Polls each camera's already-decoded detect frame via the Frigate REST
  # API (/api/<cam>/latest.jpg) and alerts on Telegram with a snapshot.
  # Dependency-only image (./firewatch); code/config/model are mounted
  # read-only so edits need only `docker compose restart firewatch`.
  # firewatch.py lives in ./firewatch (mounted at /firewatch); the shared
  # helper telegram_notify.py stays in ./scripts (mounted at /scripts). The
  # fire/smoke OpenVINO IR model must exist at ./models/fire/ (see
  # models/fire/README.md); the Telegram bot lives in config/telegram.conf
  # (git-ignored). First build needs network for pip.
  # ------------------------------------------------------------------
  firewatch:
    container_name: firewatch
    build: ./firewatch
    restart: unless-stopped
    volumes:
      - ./firewatch:/firewatch:ro
      - ./scripts:/scripts:ro
      - ./config:/config:ro
      - ./models:/models:ro
    environment:
      - FRIGATE_API=http://frigate:5000   # compose network: frigate service
      - TELEGRAM_CONF=/config/telegram.conf
      - FIREWATCH_CONF=/config/firewatch.conf
      - MODEL_DIR=/models/fire
    depends_on:
      - frigate

  # ------------------------------------------------------------------
  # telegram-bot - on-demand command responder for the farm Telegram bot
  # (see plans/telegram-command-bot.md). Long-polls the Bot API getUpdates
  # and answers /status, /help, /start IN THE CHAT THAT ASKED.
  # Dependency-free: a stock python:3.11-slim image (stdlib only) - no build.
  # Code + config are mounted read-only (like firewatch) so edits need only
  # `docker compose restart telegram-bot`. HOST health for /status comes from
  # read-only bind mounts (/proc, coretemp hwmon, ./media) + ./config for the
  # root filesystem stats and the Frigate REST API; the container never
  # writes to the host. Long-polling getUpdates must be the ONLY consumer of
  # the bot's updates (cron scripts + firewatch only SEND - no webhook).
  # ------------------------------------------------------------------
  telegram-bot:
    container_name: telegram-bot
    image: python:3.11-slim
    restart: unless-stopped
    command: ["python", "/scripts/telegram_bot.py"]
    volumes:
      - ./scripts:/scripts:ro            # telegram_bot.py + telegram_notify.py
      - ./config:/config:ro              # telegram.conf (creds + tunables)
      - /proc:/host/proc:ro              # host uptime / loadavg / meminfo / hostname
      - /sys/class/hwmon:/host/hwmon:ro  # host coretemp (CPU temp for /status)
      - ./media:/media:ro                # Frigate media filesystem usage
    environment:
      - FRIGATE_API=http://frigate:5000  # compose network: frigate service
      - TELEGRAM_CONF=/config/telegram.conf
      - HOST_PROC=/host/proc
      - HOST_HWMON=/host/hwmon
      - MEDIA_DIR=/media
      - ROOT_STAT=/config                # config mount sits on the host root fs
    depends_on:
      - frigate
