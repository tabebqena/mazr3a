# ============================================================
# Mosquitto MQTT broker - minimal configuration
# Frigate publishes events to this broker (topic frigate/#)
# ============================================================

persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 1883
# LAN-only broker. Anonymous access is acceptable for Phase 0.
# To harden later, set allow_anonymous false and add a password_file.
allow_anonymous true
