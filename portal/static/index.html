<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mazr3a CCTV</title>
<!-- Asset URLs are content-hash fingerprinted by the server (see _render_index
     in portal/app.py). The {{ ASSET_* }} tokens are substituted with the
     current /static/<name>-<hash>.<ext> on every request so the browser is
     forced to fetch fresh versions after an update. NEVER hard-code these. -->
<link rel="icon" type="image/svg+xml" href="{{ ASSET_FAVICON }}">
<link rel="stylesheet" href="{{ ASSET_STYLE }}">
</head>
<body>
  <!-- Login -->
  <div id="login-view" class="login-wrap hidden">
    <form id="login-form" class="login-card">
      <h1>mazr3a CCTV</h1>
      <p class="sub">Frigate · Firewatch</p>
      <label>Username
        <input name="username" autocomplete="username" required autofocus>
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <div id="login-error" class="err hidden"></div>
      <button type="submit">Sign in</button>
    </form>
  </div>

  <!-- App -->
  <div id="app" class="hidden">
    <header class="topbar">
      <div class="brand">mazr3a CCTV</div>
      <nav id="nav">
        <!-- Signed-in user, shown at the TOP of the collapsed menu (phones),
             above the tabs. The horizontal bar uses #user-chip in the userbox
             instead. Filled by app.js at boot from /api/me. -->
        <span id="nav-user" class="nav-user"></span>
        <a data-view="live" href="#/live">Live</a>
        <a data-view="events" href="#/events">Events</a>
        <a data-view="fire" href="#/fire">Fire alerts</a>
        <!-- Episodes = the cross-camera person stories scenereader builds from
             Frigate's own captures (narrative in English AND Arabic). -->
        <a data-view="episodes" href="#/episodes">Episodes</a>
        <!-- Scenes = the ADAPTIVE L1 scenes: one camera's burst of activity with
             the objects that coexisted in it and which of them actually MOVED
             (from each object's own Frigate trajectory). -->
        <a data-view="adaptive" href="#/adaptive">Scenes</a>
        <a data-view="scenes" href="#/scenes">Scene log</a>
        <!-- Admin-only Debug tab (shown only when the logged-in user is the
             admin - app.js removes .hidden at boot based on /api/me is_admin). -->
        <a data-view="debug" href="#/debug" id="nav-debug" class="hidden">Debug</a>
        <!-- Collapsed-menu extras (phones only - hidden when the nav is an
             inline row on tablet/desktop): sign out and the version. Sign out
             mirrors #logout-btn; the version mirrors the footer label (same
             APP_VERSION source) so the menu is self-contained. -->
        <button id="nav-logout" class="nav-logout" type="button">Sign out</button>
        <span class="nav-ver">v<span id="ver-no-nav">{{ APP_VERSION }}</span></span>
      </nav>
      <div class="userbox">
        <!-- Signed-in user for the HORIZONTAL nav layout (tablet/desktop), shown
             just before the sign-out button. On phones this is hidden and the
             username shows inside the collapsed menu (#nav-user) instead. Both
             are filled from /api/me at boot. -->
        <span id="user-chip" class="user-chip"></span>
        <button id="logout-btn" title="Sign out">&#9211;</button>
        <!-- Phones (both orientations, every tab): collapses the tab bar into a
             dropdown menu so it never costs a row/height. Hidden on
             tablet/desktop by the .nav-toggle rules in style.css; toggled by
             app.js (body.nav-open). -->
        <button id="nav-toggle" class="nav-toggle" type="button"
                title="Menu" aria-label="Menu"
                aria-expanded="false" aria-controls="nav">&#9776;</button>
      </div>
    </header>

    <main>
      <!-- Live: HLS (go2rtc, hls.js) with a detect-snapshot fallback -->
      <section id="view-live" class="view hidden">
        <div class="live-ctl">
          <!-- Toolbar above the frame. The CURRENT CAMERA NAME is the FIRST
               control: this button shows it and opens the picker (inline strip
               on tablet/desktop, modal sheet on phones). It flexes to fill the
               spare width, pushing the .live-tools group to the far end.
               Buttons are never forced full width on phones - they size to
               their content and, on very narrow screens, the whole .live-tools
               group wraps BELOW the camera name as ONE unit (never scattered). -->
          <button id="cam-picker" type="button"
                  title="Select camera" aria-label="Select camera"
                  aria-haspopup="dialog"></button>

          <span class="live-tools">
            <!-- Live audio toggle. Live HLS audio is AAC (portal transcode);
                 it starts muted so autoplay is allowed - this button (a user
                 gesture) turns sound on. The button is ALWAYS shown in the row;
                 it is just DISABLED until a live stream is really playing audio
                 (offline / interrupted / warming up = inactive, not hidden). -->
            <button id="live-sound" class="sound" type="button" disabled
                    title="Enable sound" aria-label="Enable sound">&#128263;</button>

            <!-- Save image: download the current visible frame as a JPEG.
                 Disabled while there is no frame on screen (offline / paused),
                 otherwise always shown. -->
            <button id="live-shot" type="button" disabled
                    title="Save image (download the current frame)"
                    aria-label="Save image">&#128247;</button>

            <!-- Zoom controls: +/- step around the frame centre + a reset. When
                 zoomed, drag the picture to pan (and use the mouse wheel to zoom
                 on desktop). The group is disabled whenever no frame is on
                 screen (offline / interrupted). -->
            <span class="zoom-ctl" role="group" aria-label="Zoom controls">
              <button id="zoom-out" type="button" disabled title="Zoom out"
                      aria-label="Zoom out">&#8722;</button>
              <button id="zoom-in" type="button" disabled title="Zoom in"
                      aria-label="Zoom in">&#43;</button>
              <button id="zoom-reset" type="button" disabled title="Reset zoom"
                      aria-label="Reset zoom">reset</button>
            </span>

            <!-- Stop the live stream on demand: tears the stream down and shows
                 the Resume overlay (the same one the idle-stop uses). Enabled
                 only while a stream is actually playing. -->
            <button id="live-stop" type="button" disabled
                    title="Stop the live stream"
                    aria-label="Stop live stream">&#9209;</button>

            <!-- Restart the current live stream (retry HLS) without a page
                 reload - useful after a temporary snapshot fallback. Kept as
                 the LAST control, at the far right of the tools group. -->
            <button id="live-refresh" type="button"
                    title="Restart the live stream (retry HLS)"
                    aria-label="Restart live stream">&#8635;</button>
          </span>
        </div>
        <div id="live-stage" class="stage">
          <div id="live-cam-tag" class="cam-tag"></div>
          <div id="live-spinner" class="spinner hidden" title="Connecting…"></div>
          <video id="live-video" autoplay muted playsinline class="hidden"></video>
          <img id="live-img" alt="live camera" class="hidden">
          <div id="live-overlay" class="overlay hidden">
            <div class="overlay-card">
              <div id="overlay-msg">Stream paused.</div>
              <button id="overlay-resume" type="button">&#9654; Resume</button>
            </div>
          </div>
        </div>
        <!-- Inline camera row (thumbnail per camera). Phones keep this hidden
             and pick cameras from the modal below instead. -->
        <div id="cam-strip" class="cam-strip"></div>
        <div id="live-status" class="status"></div>

        <!-- Camera picker modal: a grid of camera thumbnails; on small screens
             this is how cameras are chosen (opened by the picker button). -->
        <div id="cam-modal" class="cam-modal hidden" role="dialog"
             aria-modal="true" aria-label="Select camera">
          <div class="cam-backdrop" data-cam-close></div>
          <div class="cam-modal-card">
            <div class="cam-modal-head">
              <span>Select camera</span>
              <button id="cam-modal-close" type="button" aria-label="Close">&times;</button>
            </div>
            <div id="cam-grid" class="cam-grid"></div>
          </div>
        </div>
      </section>

      <!-- Frigate events & detections. The filter bar is UNCHANGED; below it a
           LARGE PLAYER fed by a horizontal CLIP STRIP, a PLAYLIST switch (auto-
           plays the next clip), and an idle-stop Resume overlay. The strip and
           the player replaced the old grid of per-card inline <video> elements.
           See plans/portal-events-tab-player.md. -->
      <section id="view-events" class="view hidden">
        <div class="controls">
          <label>Camera <select id="ev-cam"></select></label>
          <label>Class <input id="ev-label" list="ev-label-list" placeholder="all"></label>
          <datalist id="ev-label-list">
            <option value="person"><option value="car"><option value="motorcycle">
            <option value="truck"><option value="dog"><option value="cat">
            <option value="horse"><option value="sheep"><option value="cow">
            <option value="bird"><option value="knife">
          </datalist>
          <label>Time <select id="ev-time"></select></label>
          <div id="ev-custom-wrap" class="time-custom hidden" data-preset-sel="ev-time">
            <label>From <input id="ev-from" type="datetime-local"></label>
            <label>To <input id="ev-to" type="datetime-local"></label>
          </div>
          <button id="ev-refresh" type="button" title="Reload events">Refresh</button>
        </div>

        <!-- The large playback frame. ONE <video> is reused for every clip; the
             poster is the event snapshot so the frame is populated before play
             (no clip bytes are fetched until the user presses play). -->
        <div id="ev-stage" class="ev-stage">
          <div id="ev-stage-empty" class="ev-stage-empty">Select a clip below</div>
          <video id="ev-video" controls playsinline preload="metadata"></video>
          <div class="ev-now-bar">
            <span id="ev-now" class="ev-now"></span>
            <!-- Playlist switch: when ON, the next clip starts automatically as
                 soon as the current one ends. Disabled with no playable clip. -->
            <button id="ev-playlist" type="button" aria-pressed="false" disabled
                    title="Play the next clip automatically">Playlist: off</button>
          </div>
          <!-- Idle stop: after 1 minute without interaction the playlist is
               turned OFF and the clip is paused - this Resume button (a user
               gesture) continues where it left off and restores the playlist. -->
          <div id="ev-overlay" class="ev-overlay hidden">
            <div class="ev-overlay-card">
              <div id="ev-overlay-msg">Playlist paused after 1 minute of inactivity.</div>
              <button id="ev-overlay-resume" type="button">&#9654; Resume playing</button>
            </div>
          </div>
        </div>

        <div id="ev-status" class="status"></div>

        <!-- Clip thumbnails: one button per clip in the current page. Clicking a
             clip plays it in the large frame above. In phone LANDSCAPE this is
             the third column and can be collapsed to a slim handle via the named
             hamburger #ev-clips-toggle (app.js toggles body.ev-clips-collapsed);
             in every other layout the strip sits below the player and the
             toggle is hidden (CSS). -->
        <div id="ev-clips" class="ev-clips">
          <div class="ev-clips-head">
            <button id="ev-clips-toggle" class="ev-clips-toggle" type="button"
                    aria-expanded="true" aria-controls="ev-strip"
                    title="Show / hide clip thumbnails">
              <span class="ev-clips-icon" aria-hidden="true">&#9776;</span>
              <span class="ev-clips-name">Clips</span>
            </button>
            <!-- Count of the current filter's events, shown at the TOP of the
                 scrollable thumbnails (filled by app.js). -->
            <span id="ev-count" class="ev-clips-count"></span>
          </div>
          <div id="ev-strip" class="ev-strip" role="listbox" aria-label="Clips"></div>
        </div>

      </section>

      <!-- Firewatch fire detections & alerts -->
      <section id="view-fire" class="view hidden">
        <div class="controls">
          <label>Camera <select id="fw-cam"></select></label>
          <label>Class
            <select id="fw-label">
              <option value="">all</option>
              <option value="fire">fire</option>
              <option value="smoke">smoke</option>
            </select>
          </label>
          <label>Time <select id="fw-time"></select></label>
          <div id="fw-custom-wrap" class="time-custom hidden" data-preset-sel="fw-time">
            <label>From <input id="fw-from" type="datetime-local"></label>
            <label>To <input id="fw-to" type="datetime-local"></label>
          </div>
          <label class="check"><input id="fw-alerted" type="checkbox" checked> alerts only</label>
          <button id="fw-refresh" type="button" title="Reload fire alerts">Refresh</button>
        </div>
        <div id="fw-status" class="status"></div>
        <div id="fw-list" class="grid"></div>
        <div id="fw-pager" class="pager hidden">
          <button id="fw-prev" type="button">&#8249; Prev</button>
          <span id="fw-pageno" class="pageno"></span>
          <button id="fw-next" type="button">Next &#8250;</button>
        </div>
      </section>

      <!-- scenewatch scene descriptions. Mirrors the Fire alerts tab
           (camera/trigger/time filters, numbered pagination), but DEFAULTS to
           the important ones: scenewatch scores every caption 0-100 and tiers
           it (see score_importance), so "Show: important only" + "Sort: most
           important" surfaces the few rows worth seeing on first opening.
           Widen "Show" to dig into the rest. Each card shows the description +
           camera + time; the stored frame is the card image and opens in a
           lightbox on click. Rows captured while STORE_IMAGES=false have no
           image. -->
      <section id="view-scenes" class="view hidden">
        <div class="controls">
          <label>Camera <select id="sc-cam"></select></label>
          <label>Show
            <select id="sc-tier" title="How important a scene must be to be listed">
              <option value="high" selected>important only</option>
              <option value="normal">important + normal</option>
              <option value="all">everything</option>
            </select>
          </label>
          <label>Trigger
            <select id="sc-reason">
              <option value="">all</option>
              <option value="motion">motion</option>
              <option value="baseline">baseline</option>
            </select>
          </label>
          <label>Time <select id="sc-time"></select></label>
          <div id="sc-custom-wrap" class="time-custom hidden" data-preset-sel="sc-time">
            <label>From <input id="sc-from" type="datetime-local"></label>
            <label>To <input id="sc-to" type="datetime-local"></label>
          </div>
          <label>Sort
            <select id="sc-sort">
              <option value="importance" selected>most important</option>
              <option value="time">newest first</option>
            </select>
          </label>
          <button id="sc-refresh" type="button" title="Reload scene descriptions">Refresh</button>
        </div>
        <div id="sc-status" class="status"></div>
        <div id="sc-list" class="grid"></div>
        <div id="sc-pager" class="pager hidden">
          <button id="sc-prev" type="button">&#8249; Prev</button>
          <span id="sc-pageno" class="pageno"></span>
          <button id="sc-next" type="button">Next &#8250;</button>
        </div>
      </section>

      <!-- scenereader EPISODES: the cross-camera person stories.
           Each episode is ONE narrative built from ordered place visits, written
           deterministically in BOTH English and Arabic (no model involved), with
           the supporting captures underneath. "Process now" only ASKS the
           service for a caption batch - the service still applies its idle
           governor, so the button can never force a hot host to work. -->
      <section id="view-episodes" class="view hidden">
        <div class="controls">
          <label>Day <select id="ep-day"></select></label>
          <label>Camera <select id="ep-cam"></select></label>
          <button id="ep-refresh" type="button" title="Reload episodes">Refresh</button>
          <button id="ep-drain" type="button"
                  title="Ask scenereader for a caption batch now (it still waits for the host to be idle)">
            Process now
          </button>
        </div>
        <div id="ep-status" class="status"></div>
        <div id="ep-list" class="grid"></div>
        <div id="ep-pager" class="pager hidden">
          <button id="ep-prev" type="button">&#8249; Prev</button>
          <span id="ep-pageno" class="pageno"></span>
          <button id="ep-next" type="button">Next &#8250;</button>
        </div>
      </section>

      <!-- scenereader ADAPTIVE SCENES (L1): the level between a capture and a
           camera story. A scene is ONE camera's burst of activity (bounded by
           SCENE_GAP_S of inactivity); it lists the objects that COEXISTED and -
           from each object's own Frigate trajectory - which of them MOVED. This
           is what stops a moving dog/cow/truck in a crowded frame being narrated
           as a person's journey (plans/adaptive-scene-narrative.md).
           Deterministic English + Arabic, no model. -->
      <section id="view-adaptive" class="view hidden">
        <div class="controls">
          <label>Day <select id="as-day"></select></label>
          <label>Camera <select id="as-cam"></select></label>
          <button id="as-refresh" type="button" title="Reload scenes">Refresh</button>
        </div>
        <div id="as-status" class="status"></div>
        <div id="as-list" class="grid"></div>
        <div id="as-pager" class="pager hidden">
          <button id="as-prev" type="button">&#8249; Prev</button>
          <span id="as-pageno" class="pageno"></span>
          <button id="as-next" type="button">Next &#8250;</button>
        </div>
      </section>

      <!-- Admin-only Debug: last log messages of containers. Pulled on demand
           from the read-only `logs` sidecar when this tab opens (the sidecar
           stays idle; there is no polling). Visible only to admin.
           The Container dropdown (populated by app.js from
           /api/admin/containers) picks a single container; "All containers"
           keeps the stacked per-container view. Each container card also has
           its own ↻ button that reloads ONLY that container's tail, and lines
           are shown newest-first (top). -->
      <section id="view-debug" class="view hidden">
        <div class="controls">
          <label>Container
            <select id="dbg-container" title="Pick a container (All containers shows every container)">
              <option value="">All containers</option>
            </select>
          </label>
          <label>Lines
            <select id="dbg-tail">
              <option value="100">100</option>
              <option value="200" selected>200</option>
              <option value="500">500</option>
              <option value="1000">1000</option>
            </select>
          </label>
          <button id="dbg-refresh" type="button" title="Reload container logs">Refresh</button>
        </div>
        <div id="dbg-status" class="status"></div>
        <div id="dbg-list" class="dbg-list"></div>
      </section>
    </main>
  </div>

  <!-- Bottom-most version label: a tiny, fixed, non-interactive tag pinned to
       the lowest corner of the screen on EVERY screen - the login view and the
       loading state (when the app content is not loaded yet) as well as every
       app view. It is a direct <body> child (NOT inside #app), so showing the
       login view or a not-yet-loaded app never hides it.
       SINGLE SOURCE OF TRUTH: portal.app.APP_VERSION. The {{ APP_VERSION }} token
       is substituted server-side with APP_VERSION when the "/" route serves this
       page (see _render_index in portal/app.py) - this fallback text is what
       shows on the login/booting screens before the app boots. app.js re-fills
       #ver-no from /api/settings (the same constant) once the app boots. Never
       hard-code a version number in this file. -->
  <footer class="app-ver" title="Portal version">
    v<span id="ver-no">{{ APP_VERSION }}</span>
  </footer>

  <!-- Fire evidence lightbox: clicking a fire card image opens this full-screen
       view of the evidence JPEG as large as fits, with the detection/smoke
       boxes redrawn at full size plus the record's metadata. -->
  <div id="fw-lightbox" class="fw-lightbox hidden" role="dialog"
       aria-modal="true" aria-label="Fire evidence - larger view">
    <div class="fw-backdrop" data-fw-close></div>
    <div class="fw-lb-card">
      <div class="fw-lb-head">
        <span id="fw-lb-title">Fire evidence</span>
        <button id="fw-lb-close" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="fw-lb-body">
        <div class="fw-lb-frame">
          <img id="fw-lb-img" alt="fire evidence - larger view">
          <div id="fw-lb-boxes" class="fw-lb-boxes"></div>
        </div>
        <div id="fw-lb-meta" class="fw-lb-meta"></div>
      </div>
    </div>
  </div>

  <!-- Scene lightbox: the frame stored with a scene description, as large as
       fits, plus its camera/time/trigger metadata and the caption text.
       Reuses the fire-evidence lightbox chrome (.fw-lightbox/.fw-lb-*). -->
  <div id="sc-lightbox" class="fw-lightbox hidden" role="dialog"
       aria-modal="true" aria-label="Scene description - larger view">
    <div class="fw-backdrop" data-sc-close></div>
    <div class="fw-lb-card">
      <div class="fw-lb-head">
        <span id="sc-lb-title">Scene</span>
        <button id="sc-lb-close" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="fw-lb-body">
        <div class="fw-lb-frame">
          <img id="sc-lb-img" alt="scene frame - larger view">
        </div>
        <div id="sc-lb-meta" class="fw-lb-meta"></div>
      </div>
    </div>
  </div>

  <div id="global-err" class="toast hidden"></div>

  <script src="{{ ASSET_HLS }}"></script>
  <script src="{{ ASSET_APP }}"></script>
</body>
</html>
