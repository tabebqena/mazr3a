<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mazr3a CCTV</title>
<!-- Asset URLs are content-hash fingerprinted by the server (see _render_index
     in portal/app.py). The {{ ASSET_* }} tokens are substituted with the
     current /static/<name>-<hash>.<ext> on every request so the browser is
     forced to fetch fresh versions after an update. NEVER hard-code these. -->
<link rel="icon" type="image/svg+xml" href="{{ ASSET_FAVICON }}">
<link rel="stylesheet" href="{{ ASSET_STYLE }}">
</head>
<body>
  <!-- Login -->
  <div id="login-view" class="login-wrap hidden">
    <form id="login-form" class="login-card">
      <h1>mazr3a CCTV</h1>
      <p class="sub">Frigate · Firewatch</p>
      <label>Username
        <input name="username" autocomplete="username" required autofocus>
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <div id="login-error" class="err hidden"></div>
      <button type="submit">Sign in</button>
    </form>
  </div>

  <!-- App -->
  <div id="app" class="hidden">
    <header class="topbar">
      <div class="brand">mazr3a CCTV</div>
      <nav id="nav">
        <a data-view="live" href="#/live">Live</a>
        <a data-view="events" href="#/events">Events</a>
        <a data-view="fire" href="#/fire">Fire alerts</a>
        <!-- Admin-only Debug tab (shown only when the logged-in user is the
             admin - app.js removes .hidden at boot based on /api/me is_admin). -->
        <a data-view="debug" href="#/debug" id="nav-debug" class="hidden">Debug</a>
      </nav>
      <div class="userbox">
        <span id="user-chip"></span>
        <button id="logout-btn" title="Sign out">&#9211;</button>
      </div>
    </header>

    <main>
      <!-- Live: HLS (go2rtc, hls.js) with a detect-snapshot fallback -->
      <section id="view-live" class="view hidden">
        <div class="live-ctl">
          <!-- Toolbar above the frame. The CURRENT CAMERA NAME is the FIRST
               control: this button shows it and opens the picker (inline strip
               on tablet/desktop, modal sheet on phones). It flexes to fill the
               spare width, pushing the .live-tools group to the far end.
               Buttons are never forced full width on phones - they size to
               their content and, on very narrow screens, the whole .live-tools
               group wraps BELOW the camera name as ONE unit (never scattered). -->
          <button id="cam-picker" type="button"
                  title="Select camera" aria-label="Select camera"
                  aria-haspopup="dialog"></button>

          <span class="live-tools">
            <!-- Live audio toggle. Live HLS audio is AAC (portal transcode);
                 it starts muted so autoplay is allowed - this button (a user
                 gesture) turns sound on. The button is ALWAYS shown in the row;
                 it is just DISABLED until a live stream is really playing audio
                 (offline / interrupted / warming up = inactive, not hidden). -->
            <button id="live-sound" class="sound" type="button" disabled
                    title="Enable sound" aria-label="Enable sound">&#128263;</button>

            <!-- Save image: download the current visible frame as a JPEG.
                 Disabled while there is no frame on screen (offline / paused),
                 otherwise always shown. -->
            <button id="live-shot" type="button" disabled
                    title="Save image (download the current frame)"
                    aria-label="Save image">&#128247;</button>

            <!-- Zoom controls: +/- step around the frame centre + a reset. When
                 zoomed, drag the picture to pan (and use the mouse wheel to zoom
                 on desktop). The group is disabled whenever no frame is on
                 screen (offline / interrupted). -->
            <span class="zoom-ctl" role="group" aria-label="Zoom controls">
              <button id="zoom-out" type="button" disabled title="Zoom out"
                      aria-label="Zoom out">&#8722;</button>
              <button id="zoom-in" type="button" disabled title="Zoom in"
                      aria-label="Zoom in">&#43;</button>
              <button id="zoom-reset" type="button" disabled title="Reset zoom"
                      aria-label="Reset zoom">reset</button>
            </span>

            <!-- Restart the current live stream (retry HLS) without a page
                 reload - useful after a temporary snapshot fallback. Kept as
                 the LAST control, at the far right of the tools group. -->
            <button id="live-refresh" type="button"
                    title="Restart the live stream (retry HLS)"
                    aria-label="Restart live stream">&#8635;</button>
          </span>
        </div>
        <div id="live-stage" class="stage">
          <div id="live-cam-tag" class="cam-tag"></div>
          <div id="live-spinner" class="spinner hidden" title="Connecting…"></div>
          <video id="live-video" autoplay muted playsinline class="hidden"></video>
          <img id="live-img" alt="live camera" class="hidden">
          <div id="live-overlay" class="overlay hidden">
            <div class="overlay-card">
              <div id="overlay-msg">Stream paused.</div>
              <button id="overlay-resume" type="button">&#9654; Resume</button>
            </div>
          </div>
        </div>
        <!-- Prev/next camera (wrap around): small buttons below the live frame. -->
        <div class="live-foot">
          <button id="cam-prev" type="button" title="Previous camera"
                  aria-label="Previous camera">&#8249;</button>
          <button id="cam-next" type="button" title="Next camera"
                  aria-label="Next camera">&#8250;</button>
        </div>
        <!-- Inline camera row (thumbnail per camera). Phones keep this hidden
             and pick cameras from the modal below instead. -->
        <div id="cam-strip" class="cam-strip"></div>
        <div id="live-status" class="status"></div>

        <!-- Camera picker modal: a grid of camera thumbnails; on small screens
             this is how cameras are chosen (opened by the picker button). -->
        <div id="cam-modal" class="cam-modal hidden" role="dialog"
             aria-modal="true" aria-label="Select camera">
          <div class="cam-backdrop" data-cam-close></div>
          <div class="cam-modal-card">
            <div class="cam-modal-head">
              <span>Select camera</span>
              <button id="cam-modal-close" type="button" aria-label="Close">&times;</button>
            </div>
            <div id="cam-grid" class="cam-grid"></div>
          </div>
        </div>
      </section>

      <!-- Frigate events & detections -->
      <section id="view-events" class="view hidden">
        <div class="controls">
          <label>Camera <select id="ev-cam"></select></label>
          <label>Class <input id="ev-label" list="ev-label-list" placeholder="all"></label>
          <datalist id="ev-label-list">
            <option value="person"><option value="car"><option value="motorcycle">
            <option value="truck"><option value="dog"><option value="cat">
            <option value="horse"><option value="sheep"><option value="cow">
            <option value="bird"><option value="knife">
          </datalist>
          <label>Time <select id="ev-time"></select></label>
          <div id="ev-custom-wrap" class="time-custom hidden" data-preset-sel="ev-time">
            <label>From <input id="ev-from" type="datetime-local"></label>
            <label>To <input id="ev-to" type="datetime-local"></label>
          </div>
          <button id="ev-refresh" type="button" title="Reload events">Refresh</button>
        </div>
        <div id="ev-status" class="status"></div>
        <div id="ev-list" class="list"></div>
        <div id="ev-pager" class="pager hidden">
          <button id="ev-prev" type="button">&#8249; Prev</button>
          <span id="ev-pageno" class="pageno"></span>
          <button id="ev-next" type="button">Next &#8250;</button>
        </div>
      </section>

      <!-- Firewatch fire detections & alerts -->
      <section id="view-fire" class="view hidden">
        <div class="controls">
          <label>Camera <select id="fw-cam"></select></label>
          <label>Class
            <select id="fw-label">
              <option value="">all</option>
              <option value="fire">fire</option>
              <option value="smoke">smoke</option>
            </select>
          </label>
          <label>Time <select id="fw-time"></select></label>
          <div id="fw-custom-wrap" class="time-custom hidden" data-preset-sel="fw-time">
            <label>From <input id="fw-from" type="datetime-local"></label>
            <label>To <input id="fw-to" type="datetime-local"></label>
          </div>
          <label class="check"><input id="fw-alerted" type="checkbox" checked> alerts only</label>
          <button id="fw-refresh" type="button" title="Reload fire alerts">Refresh</button>
        </div>
        <div id="fw-status" class="status"></div>
        <div id="fw-list" class="grid"></div>
        <div id="fw-pager" class="pager hidden">
          <button id="fw-prev" type="button">&#8249; Prev</button>
          <span id="fw-pageno" class="pageno"></span>
          <button id="fw-next" type="button">Next &#8250;</button>
        </div>
      </section>

      <!-- Admin-only Debug: last log messages of containers. Pulled on demand
           from the read-only `logs` sidecar when this tab opens (the sidecar
           stays idle; there is no polling). Visible only to admin.
           The Container dropdown (populated by app.js from
           /api/admin/containers) picks a single container; "All containers"
           keeps the stacked per-container view. Each container card also has
           its own ↻ button that reloads ONLY that container's tail, and lines
           are shown newest-first (top). -->
      <section id="view-debug" class="view hidden">
        <div class="controls">
          <label>Container
            <select id="dbg-container" title="Pick a container (All containers shows every container)">
              <option value="">All containers</option>
            </select>
          </label>
          <label>Lines
            <select id="dbg-tail">
              <option value="100">100</option>
              <option value="200" selected>200</option>
              <option value="500">500</option>
              <option value="1000">1000</option>
            </select>
          </label>
          <button id="dbg-refresh" type="button" title="Reload container logs">Refresh</button>
        </div>
        <div id="dbg-status" class="status"></div>
        <div id="dbg-list" class="dbg-list"></div>
      </section>
    </main>
  </div>

  <!-- Bottom-most version label: a tiny, fixed, non-interactive tag pinned to
       the lowest corner of the screen on EVERY screen - the login view and the
       loading state (when the app content is not loaded yet) as well as every
       app view. It is a direct <body> child (NOT inside #app), so showing the
       login view or a not-yet-loaded app never hides it.
       SINGLE SOURCE OF TRUTH: portal.app.APP_VERSION. The {{ APP_VERSION }} token
       is substituted server-side with APP_VERSION when the "/" route serves this
       page (see _render_index in portal/app.py) - this fallback text is what
       shows on the login/booting screens before the app boots. app.js re-fills
       #ver-no from /api/settings (the same constant) once the app boots. Never
       hard-code a version number in this file. -->
  <footer class="app-ver" title="Portal version">
    v<span id="ver-no">{{ APP_VERSION }}</span>
  </footer>

  <!-- Fire evidence lightbox: clicking a fire card image opens this full-screen
       view of the evidence JPEG as large as fits, with the detection/smoke
       boxes redrawn at full size plus the record's metadata. -->
  <div id="fw-lightbox" class="fw-lightbox hidden" role="dialog"
       aria-modal="true" aria-label="Fire evidence - larger view">
    <div class="fw-backdrop" data-fw-close></div>
    <div class="fw-lb-card">
      <div class="fw-lb-head">
        <span id="fw-lb-title">Fire evidence</span>
        <button id="fw-lb-close" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="fw-lb-body">
        <div class="fw-lb-frame">
          <img id="fw-lb-img" alt="fire evidence - larger view">
          <div id="fw-lb-boxes" class="fw-lb-boxes"></div>
        </div>
        <div id="fw-lb-meta" class="fw-lb-meta"></div>
      </div>
    </div>
  </div>

  <div id="global-err" class="toast hidden"></div>

  <script src="{{ ASSET_HLS }}"></script>
  <script src="{{ ASSET_APP }}"></script>
</body>
</html>
